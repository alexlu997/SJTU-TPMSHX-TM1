# Packaging and dependency source for local development and CI.
# Repository imports use the package-qualified `sjtu_tpmshx.*` form.

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sjtu-tpmshx"
dynamic = ["version"]   # 单源：sjtu_tpmshx/_version.py（P1.9）
description = "Compressible SIMPLE/LTNE solver suite for TPMS heat exchangers (SJTU)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # Normal installation uses this list. Historical machine snapshots remain
    # separate and do not define current project dependencies.
    "numpy>=2.5.4,<2.6",
    "scipy>=1.18",
    "pandas>=3.0",
    "sympy>=1.14",
    "joblib>=1.6",
    "matplotlib>=3.11",
    "openpyxl>=3.1",
    "CoolProp>=8.0",
    "scikit-image>=0.26",
]

[project.optional-dependencies]
io = ["h5py>=3.16", "PyYAML>=6.0.3"]
gui = ["PySide6>=6.12", "pyvista>=0.49.1", "pyvistaqt>=0.13"]
bo = ["torch>=2.14", "botorch>=0.18", "gpytorch>=1.15.2"]
test = ["pytest>=9.1", "pytest-xdist>=3.8", "pytest-timeout>=2.4"]
dev = ["ruff>=0.17", "mypy>=2.4"]
desktop-build = ["pyinstaller==6.22.3"]

[project.scripts]
tpmshx-run = "sjtu_tpmshx.cli:main"

[project.gui-scripts]
tpmshx-gui = "sjtu_tpmshx.desktop:main"

[tool.tpmshx.native-dependencies]
# Explicit native builds; Python package installation does not provision these dependencies.
requirements = ["CMake==4.4.4", "CoolProp==8.0.0", "SuperLU==7.0.1", "AMGCL==1.5.0"]
lock-file = "native/dependencies-lock.toml"
build-script = "scripts/build_native_dependencies.py"
cache-dir = ".cache/native-deps"
runtime-auto-fetch = false

[tool.ruff]
# Lint keeps the existing source formatting and checks error-level rules only.
target-version = "py312"

[tool.ruff.lint]
# F = pyflakes（真错误类），E9 = 语法级。F841 存量 52 处已于 P2.1b（iter 23）
# 逐案清偿（死拉取删除 / Qt keep-alive 改 _ 前缀 / 副作用调用去名留调），
# 自此全量执法。
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# 包入口的显式导出。
"sjtu_tpmshx/**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
# Strict markers make spelling errors fail during collection.
testpaths = ["sjtu_tpmshx/tests"]
addopts = ["--strict-markers"]
markers = [
    "slow: heavyweight real-solve test; excluded from the CI fast subset (-m \"not slow\")",
    "fast: cheap smoke subset (opt-in via -m fast)",
    "heavy: call-duration >= 30s per census manifest (tests/_fast_tier_manifest.txt, conftest-applied); excluded by the development and CI subset",
]

[tool.mypy]
# Check the selected public interfaces and data contracts from the repository root.
# Silent imports keep the existing solver type-check scope.
files = [
    "sjtu_tpmshx/workflows/compute.py",
    "sjtu_tpmshx/controllers/module_adapter.py",
    "sjtu_tpmshx/domain/compute_config.py",
    "sjtu_tpmshx/domain/validator.py",
    "sjtu_tpmshx/domain/compute_result.py",
    "sjtu_tpmshx/configs/__init__.py",
    "sjtu_tpmshx/_version.py",
    "sjtu_tpmshx/cli.py",
    "sjtu_tpmshx/models/envelope.py",
    "sjtu_tpmshx/domain/case_data.py",
    "sjtu_tpmshx/domain/field_result.py",
    "sjtu_tpmshx/domain/performance_result.py",
    "sjtu_tpmshx/domain/metric_spec.py",
    "sjtu_tpmshx/domain/module_ports.py",
    "sjtu_tpmshx/domain/model_refs.py",
    "sjtu_tpmshx/preprocess/api.py",
    "sjtu_tpmshx/solvers/api.py",
    "sjtu_tpmshx/postprocess/api.py",
    "sjtu_tpmshx/postprocess/metrics.py",
]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
no_implicit_optional = true
# P1.8b（W0 引入，F2 定型）：explicit_package_bases + 仓库根 cwd ⇒ 模块名
# 恒为 sjtu_tpmshx.*，与包内 __init__ 上溯一致，杜绝 "found twice" 双名。
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "sjtu_tpmshx.models.envelope",
    "sjtu_tpmshx.preprocess.api",
    "sjtu_tpmshx.solvers.api",
    "sjtu_tpmshx.postprocess.metrics",
]
# 这些边界文件中的无注解辅助函数也必须检查函数体。
check_untyped_defs = true

[tool.setuptools.dynamic]
version = { attr = "sjtu_tpmshx._version.__version__" }

[tool.setuptools.packages.find]
include = ["sjtu_tpmshx*"]

[tool.setuptools.package-data]
sjtu_tpmshx = [
    "configs/*.json",
    "df_surrogate/_prebuilt/*.csv",
    "validation/*.meta.json",
    "ui/assets/icons/*.svg",
    "ui/assets/icons/LICENSE",
    "ui/assets/icons/README.md",
]
