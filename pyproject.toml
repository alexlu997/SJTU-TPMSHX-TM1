# Packaging and dependency source for local development and CI.
# Repository imports use the package-qualified `sjtu_tpmshx.*` form.

[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sjtu-tpmshx"
dynamic = ["version"]   # 单源：sjtu_tpmshx/_version.py（P1.9）
description = "Compressible SIMPLE/LTNE solver suite for TPMS heat exchangers (SJTU)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
dependencies = [
    # Normal installation uses this list. Historical machine snapshots remain
    # separate and do not define current project dependencies.
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.0",
    "sympy>=1.13",
    "pyamg>=5.2",
    "joblib>=1.3",
    "numba>=0.60",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "CoolProp>=6.4",
    "scikit-image>=0.24",
]

[project.optional-dependencies]
io = ["h5py>=3.15.1", "PyYAML>=6.0.3"]
gui = ["PySide6>=6.7", "pyvista>=0.45", "pyvistaqt>=0.11"]
bo = ["torch>=2.2", "botorch>=0.10", "gpytorch>=1.11"]
test = ["pytest>=8.0", "pytest-xdist>=3.5", "pytest-timeout>=2.3"]
dev = ["ruff>=0.15", "mypy>=2.0"]
tools = ["Markdown>=3.10"]

[project.scripts]
tpmshx-run = "sjtu_tpmshx.cli:main"

[tool.ruff]
# Lint keeps the existing source formatting and checks error-level rules only.
target-version = "py312"

[tool.ruff.lint]
# F = pyflakes（真错误类），E9 = 语法级。F841 存量 52 处已于 P2.1b（iter 23）
# 逐案清偿（死拉取删除 / Qt keep-alive 改 _ 前缀 / 副作用调用去名留调），
# 自此全量执法。
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# 包入口的显式导出。
"sjtu_tpmshx/**/__init__.py" = ["F401"]

[tool.mypy]
# P2.2（2026-07-21）：宽松档，只锁"核心公共面"——envelope 权威、compute_pipeline
# 接缝、domain 配置/结果、CLI。运行方式（P1.8b F2 起仓库根基底，与包名风格一致）：
#   python -m mypy @mypy-core-files.txt   （cwd = 仓库根）
# 文件清单在 mypy-core-files.txt；扩圈 = 往清单加文件并清零（后续波次）。
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
no_implicit_optional = true
# P1.8b（W0 引入，F2 定型）：explicit_package_bases + 仓库根 cwd ⇒ 模块名
# 恒为 sjtu_tpmshx.*，与包内 __init__ 上溯一致，杜绝 "found twice" 双名。
explicit_package_bases = true

[tool.setuptools.dynamic]
version = { attr = "sjtu_tpmshx._version.__version__" }

[tool.setuptools.packages.find]
include = ["sjtu_tpmshx*"]

[tool.setuptools.package-data]
sjtu_tpmshx = [
    "configs/*.json",
    "df_surrogate/_prebuilt/*.csv",
    "validation/*.meta.json",
    "tests/_data_*.json",
]
