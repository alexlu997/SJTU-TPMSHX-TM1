# Fixed native solver and verification inputs. Source/build outputs stay in .cache/.
schema-version = 1
scope = "native-solver-and-component-verification"
platforms = ["macos-arm64", "windows-x64"]
parallel = 2

[cmake]
version = "4.4.4"
checksum-url = "https://github.com/Kitware/CMake/releases/download/v4.4.4/cmake-4.4.4-SHA-256.txt"
license-url = "https://raw.githubusercontent.com/Kitware/CMake/v4.4.4/Copyright.txt"

[cmake.macos-arm64]
url = "https://github.com/Kitware/CMake/releases/download/v4.4.4/cmake-4.4.4-macos-universal.tar.gz"
sha256 = "4b7b73704b1db9b374e5c9ab8e17ac6148b817b6396ee75cd94a852cbac9d305"
executable = "cmake-4.4.4-macos-universal/CMake.app/Contents/bin/cmake"
generator = "Unix Makefiles"

[cmake.windows-x64]
url = "https://github.com/Kitware/CMake/releases/download/v4.4.4/cmake-4.4.4-windows-x86_64.zip"
sha256 = "bace36e94b31c68ab6fa295f26dfa11219e0701cf7c94b0284a7d1cb13dac536"
executable = "cmake-4.4.4-windows-x86_64/bin/cmake.exe"
generator = "Visual Studio 17 2022"

[sources.coolprop]
version = "8.0.0"
repository = "https://github.com/CoolProp/CoolProp.git"
ref = "v8.0.0"
commit = "ae81610e7d23efc57f9d051c8e70a4d66e87537f"
directory = "CoolProp-8.0.0"
license = "MIT; retain each bundled and submodule license separately"
license-url = "https://raw.githubusercontent.com/CoolProp/CoolProp/ae81610e7d23efc57f9d051c8e70a4d66e87537f/LICENSE"
cmake-options = ["COOLPROP_STATIC_LIBRARY=ON", "COOLPROP_RELEASE=ON", "COOLPROP_NO_EXAMPLES=ON", "CMAKE_POSITION_INDEPENDENT_CODE=ON", "CMAKE_BUILD_TYPE=Release", "CMAKE_CXX_FLAGS=-DEIGEN_MPL2_ONLY", "CMAKE_EXPORT_COMPILE_COMMANDS=ON"]
windows-options = ["COOLPROP_MSVC_DYNAMIC=ON", "CMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL"]
backends = "Keep all version-default backends, including HEOS and BICUBIC; no EOS replacement"

[sources.superlu]
version = "7.0.1"
repository = "https://github.com/xiaoyeli/superlu.git"
# Upstream v7.0.1 with the selected SciPy 1.18.1 double-LU corrections.
commit = "83a3c82b9e44c966ca2bc26991ffdb2bf63e1e2b"
directory = "superlu-7.0.1"
license = "BSD-3-Clause for compiled LU sources; MC64 is excluded"
license-url = "https://raw.githubusercontent.com/xiaoyeli/superlu/83a3c82b9e44c966ca2bc26991ffdb2bf63e1e2b/License.txt"
source-list = "native/dependency-pilot/superlu-lu-only.cmake"
build-options = ["double-real LU only", "32-bit int_t", "macOS: system Accelerate NEWLAPACK LP64, USE_VENDOR_BLAS=1", "Windows: portable internal double CBLAS pending native qualification", "static PIC", "COLAMD", "no METIS", "no Fortran", "no examples/tests", "no MC64/ILU factorization paths", "SCIPY_FIX=1 for selected double-LU corrections"]
scipy-version = "1.18.1"
scipy-commit = "e4e854eaa8f18d807cd3496028e257e36caa93cc"
scipy-patch-url = "https://raw.githubusercontent.com/scipy/scipy/e4e854eaa8f18d807cd3496028e257e36caa93cc/scipy/sparse/linalg/_dsolve/SuperLU/scipychanges.patch"
scipy-readme-url = "https://raw.githubusercontent.com/scipy/scipy/e4e854eaa8f18d807cd3496028e257e36caa93cc/scipy/sparse/linalg/_dsolve/SuperLU/README.scipy"
scipy-patch-files = ["SRC/dpanel_bmod.c", "SRC/dpivotL.c", "SRC/dsnode_bmod.c"]
scipy-patch-exclusions = ["single/complex/ILU files: not compiled", "Python allocator and abort hooks: not imported", "Fortran symbol/header configuration: project selects system Accelerate LP64 or portable CBLAS", "METIS: not enabled"]
macos-system-blas = "Accelerate framework, macOS >=13.3, dgemm/dgemv/dtrsm/dtrsv $NEWLAPACK LP64 symbols; already supplied by the operating system, no copied or downloaded binary"
error-boundary = "Project C solve wrapper intercepts USER_MALLOC/FREE/ABORT with a thread-local allocation ledger and bounded error return; raw vendor calls outside this boundary are unsupported"

[sources.amgcl]
version = "1.5.0"
repository = "https://github.com/ddemidov/amgcl.git"
ref = "1.5.0"
commit = "f4614a7e9ccfe716c4c96df75dc349157229609a"
directory = "amgcl-1.5.0"
license = "MIT"
license-url = "https://raw.githubusercontent.com/ddemidov/amgcl/f4614a7e9ccfe716c4c96df75dc349157229609a/LICENSE.md"
build-options = ["header-only", "AMGCL_NO_BOOST", "builtin<double>", "single-threaded", "no OpenMP/MPI/GPU"]
algorithm-boundary = "Staggered-temperature MAC candidate only: RS direct interpolation differs from PyAMG classical interpolation and requires its own qualification. Pressure uses the locked PyAMG/SciPy original-algorithm excerpts in native/src/classical_amg*."

