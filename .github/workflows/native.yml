# Build and qualify one platform without waiting for other platform builds.
name: native

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string

jobs:
  native-build:
    name: native-build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      MPLCONFIGDIR: .cache/matplotlib
      XDG_CACHE_HOME: .cache/xdg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TPMSHX_REQUIRE_NATIVE_DEPS_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Activate MSVC for native qualification
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'The required MSVC compiler is missing' }
          & "$installation\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          'CXX=cl' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements/base.txt
      - name: Create isolated native qualification environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sjtu-native-ci-venv"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'sjtu-native-ci-venv'
          interpreter = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          Path('.venv-path').write_text(interpreter.as_posix() + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'CI_PYTHON={interpreter.as_posix()}\n')
          PY
      - name: Install locked qualification dependencies
        shell: bash
        run: '"$CI_PYTHON" -m pip install -r requirements/base.txt'
      - name: Check exact dependency lock
        shell: bash
        run: '"$CI_PYTHON" -m sjtu_tpmshx.runs.tools.check_locked_environment requirements/base.txt'
      - name: Check dependency compatibility
        shell: bash
        run: '"$CI_PYTHON" -m pip check'
      - name: Fetch fixed native sources and build tool
        shell: bash
        run: '"$CI_PYTHON" scripts/build_native_dependencies.py fetch'
      - name: Record hosted toolchain image
        id: toolchain
        shell: bash
        run: echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Cache locked CoolProp static library
        id: coolprop
        uses: actions/cache@v6
        with:
          path: |
            .cache/native-deps/build/coolprop-macos-arm64/libCoolProp.a
            .cache/native-deps/build/coolprop-windows-x64/Release/CoolProp.lib
          key: coolprop-${{ runner.os }}-${{ runner.arch }}-py3.13-${{ steps.toolchain.outputs.image }}-${{ hashFiles('native/dependencies-lock.toml', 'scripts/build_native_dependencies.py') }}
      - name: Build locked CoolProp on cache miss
        if: steps.coolprop.outputs.cache-hit != 'true'
        shell: bash
        run: '"$CI_PYTHON" scripts/build_native_dependencies.py build --component coolprop'
      - name: Build current project libraries and callers offline
        shell: bash
        run: '"$CI_PYTHON" scripts/build_native_dependencies.py build --component pilot'
      - name: Run independent native callers
        shell: bash
        run: '"$CI_PYTHON" scripts/build_native_dependencies.py verify'
      - name: Pack native runtime files with executable permissions
        shell: bash
        run: |
          "$CI_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          import tarfile
          host = 'windows-x64' if os.name == 'nt' else 'macos-arm64'
          build = Path('.cache/native-deps/build') / ('pilot-' + host)
          files = [path for path in build.iterdir() if path.is_file() and (
              path.suffix in {'.dll', '.dylib', '.exe'} or
              (not path.suffix and os.access(path, os.X_OK)))]
          prefix, suffix = ('', '.dll') if os.name == 'nt' else ('lib', '.dylib')
          required = {prefix + name + suffix for name in ('tpmshx_solver_shared', 'tpmshx_model_h_shared')}
          required.add('eos_smoke.exe' if os.name == 'nt' else 'eos_smoke')
          assert required <= {path.name for path in files}, 'Missing native runtime files'
          archive = Path('.cache/ci-native-build/native-binaries.tar')
          archive.parent.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive, 'w') as output:
              for path in files:
                  output.add(path, arcname=path.relative_to(build.parent), recursive=False)
              output.add('LICENSE', arcname='LICENSE')
              output.add('native/THIRD_PARTY_NOTICES.md', arcname='THIRD_PARTY_NOTICES.md')
              output.add('native/licenses', arcname='licenses')
          print(f'Packed {len(files)} native runtime files ({archive.stat().st_size} bytes)')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: native-build-${{ inputs.os }}
          path: .cache/ci-native-build/native-binaries.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Save native build and independent caller logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-build-logs-${{ inputs.os }}
          path: .cache/native-deps/logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  native-dependencies:
    needs: native-build
    name: native-dependencies (${{ matrix.python }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.os == 'macos-14' && '["3.13"]' || '["3.12","3.13"]') }}
        shard: ${{ fromJSON(inputs.os == 'macos-14' && '[0,1,2,3]' || '[0,1,2,3,4,5,6]') }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    env:
      NATIVE_SHARD_SET: ${{ inputs.os == 'macos-14' && 'macos' || 'windows' }}
      PYTHONHASHSEED: "0"
      MPLCONFIGDIR: .cache/matplotlib
      XDG_CACHE_HOME: .cache/xdg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TPMSHX_REQUIRE_NATIVE_DEPS_TESTS: "1"
      TPMSHX_REQUIRE_CPP_TESTS: "1"
      QT_QPA_PLATFORM: offscreen
      TPMSHX_DISABLE_3D_PANEL: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Activate MSVC for native qualification
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'The required MSVC compiler is missing' }
          & "$installation\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          'CXX=cl' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/base.txt
      - name: Create isolated native qualification environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sjtu-native-ci-venv"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'sjtu-native-ci-venv'
          interpreter = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          Path('.venv-path').write_text(interpreter.as_posix() + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'CI_PYTHON={interpreter.as_posix()}\n')
          PY
      - name: Install locked qualification dependencies
        shell: bash
        run: '"$CI_PYTHON" -m pip install -r requirements/base.txt'
      - name: Check exact dependency lock
        shell: bash
        run: '"$CI_PYTHON" -m sjtu_tpmshx.runs.tools.check_locked_environment requirements/base.txt'
      - name: Check dependency compatibility
        shell: bash
        run: '"$CI_PYTHON" -m pip check'
      - uses: actions/download-artifact@v8
        with:
          name: native-build-${{ inputs.os }}
          path: .cache/ci-native-build
      - name: Restore native runtime files
        shell: bash
        run: |
          "$CI_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import tarfile
          with tarfile.open('.cache/ci-native-build/native-binaries.tar') as archive:
              archive.extractall('.cache/native-deps/build', filter='data')
          host = 'windows-x64' if os.name == 'nt' else 'macos-arm64'
          name = 'tpmshx_solver_shared.dll' if os.name == 'nt' else 'libtpmshx_solver_shared.dylib'
          target = Path('native/lib') / host
          target.mkdir(parents=True, exist_ok=True)
          shutil.copy2(Path('.cache/native-deps/build') / ('pilot-' + host) / name, target / name)
          PY
      - name: Fetch locked Eigen headers for fixture-built libraries
        shell: bash
        run: '"$CI_PYTHON" scripts/build_native_dependencies.py fetch-eigen'
      - name: Require explicit native libraries for thermal evidence tests
        shell: bash
        run: |
          "$CI_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          host = 'windows-x64' if os.name == 'nt' else 'macos-arm64'
          prefix, suffix = ('', '.dll') if os.name == 'nt' else ('lib', '.dylib')
          build = Path('.cache/native-deps/build') / ('pilot-' + host)
          libraries = {
              'TPMSHX_NATIVE_SOLVER_LIBRARY': build / (prefix + 'tpmshx_solver_shared' + suffix),
              'TPMSHX_MODEL_H_PUBLIC_LIBRARY': build / (prefix + 'tpmshx_model_h_shared' + suffix),
          }
          for name, path in libraries.items():
              if not path.is_file():
                  raise FileNotFoundError(f'{name}: native library not built: {path}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for name, path in libraries.items():
                  output.write(f'{name}={path.resolve().as_posix()}\n')
          PY
      - name: Require native property, flow and thermal qualification
        shell: bash
        run: |
          shard_options=()
          for group in sjtu_tpmshx/tests/native/_ci_"$NATIVE_SHARD_SET"_shard*.txt; do
            shard_options+=("--ci-shard-modules=$group")
          done
          "$CI_PYTHON" -m pytest -q -ra \
          @sjtu_tpmshx/tests/native/_ci_suite.txt \
          -p sjtu_tpmshx.tests.ci_shard --ci-shard=${{ matrix.shard }} \
          "${shard_options[@]}" \
          --ci-manifest=.cache/ci/native-manifest \
          --timeout=600 --timeout-method=thread --durations=20 \
          --junitxml=.cache/ci/native-dependencies.xml
      - name: Save native qualification outcomes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-dependencies-${{ inputs.os }}-py${{ matrix.python }}-shard-${{ matrix.shard }}
          path: .cache/ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  test-parts:
    needs: native-build
    name: test-part (${{ inputs.os }}, ${{ matrix.python }}, ${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.os == 'macos-14' && '["3.13"]' || '["3.12","3.13"]') }}
        part: [fast-0, fast-1, integration]
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      MPLCONFIGDIR: .cache/matplotlib
      XDG_CACHE_HOME: .cache/xdg
      QT_QPA_PLATFORM: offscreen
      TPMSHX_DISABLE_3D_PANEL: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TPMSHX_REQUIRE_CPP_TESTS: "1"
      TPMSHX_REQUIRE_NATIVE_DEPS_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Activate MSVC for native tests
        if: runner.os == 'Windows' && startsWith(matrix.part, 'fast-')
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'The required MSVC compiler is missing' }
          & "$installation\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          'CXX=cl' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            pyproject.toml
      - name: Create isolated CI environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sjtu-ci-venv"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'sjtu-ci-venv'
          interpreter = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          Path('.venv-path').write_text(interpreter.as_posix() + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'CI_PYTHON={interpreter.as_posix()}\n')
          PY
      - name: Install project
        shell: bash
        run: '"$CI_PYTHON" -m pip install -r requirements.txt'
      - name: Check exact dependency lock
        shell: bash
        run: '"$CI_PYTHON" -m sjtu_tpmshx.runs.tools.check_locked_environment requirements/base.txt --allow-extra sjtu-tpmshx'
      - name: Check dependency compatibility
        shell: bash
        run: '"$CI_PYTHON" -m pip check'
      - uses: actions/download-artifact@v8
        with:
          name: native-build-${{ inputs.os }}
          path: .cache/ci-native-build
      - name: Restore native runtime files
        shell: bash
        run: |
          "$CI_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import tarfile
          with tarfile.open('.cache/ci-native-build/native-binaries.tar') as archive:
              archive.extractall('.cache/native-deps/build', filter='data')
          host = 'windows-x64' if os.name == 'nt' else 'macos-arm64'
          name = 'tpmshx_solver_shared.dll' if os.name == 'nt' else 'libtpmshx_solver_shared.dylib'
          target = Path('native/lib') / host
          target.mkdir(parents=True, exist_ok=True)
          shutil.copy2(Path('.cache/native-deps/build') / ('pilot-' + host) / name, target / name)
          PY
      - name: Require explicit native libraries for thermal evidence tests
        shell: bash
        run: |
          "$CI_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          host = 'windows-x64' if os.name == 'nt' else 'macos-arm64'
          prefix, suffix = ('', '.dll') if os.name == 'nt' else ('lib', '.dylib')
          build = Path('.cache/native-deps/build') / ('pilot-' + host)
          libraries = {
              'TPMSHX_NATIVE_SOLVER_LIBRARY': build / (prefix + 'tpmshx_solver_shared' + suffix),
              'TPMSHX_MODEL_H_PUBLIC_LIBRARY': build / (prefix + 'tpmshx_model_h_shared' + suffix),
          }
          for name, path in libraries.items():
              if not path.is_file():
                  raise FileNotFoundError(f'{name}: native library not built: {path}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for name, path in libraries.items():
                  output.write(f'{name}={path.resolve().as_posix()}\n')
          PY
      - name: Fetch locked Eigen headers for native temperature tests
        if: startsWith(matrix.part, 'fast-')
        shell: bash
        run: '"$CI_PYTHON" scripts/build_native_dependencies.py fetch-eigen'
      - name: Build and run independent C and C++ callers on macOS
        if: runner.os == 'macOS' && matrix.part == 'fast-0'
        run: make -f native/Makefile check
      - name: Build and run independent C and C++ callers on Windows
        if: runner.os == 'Windows' && matrix.part == 'fast-0'
        shell: cmd
        run: nmake /f native\Makefile.msvc check
      - name: Run fast test subset
        if: startsWith(matrix.part, 'fast-')
        shell: bash
        run: >-
          "$CI_PYTHON" -m pytest sjtu_tpmshx/tests/ -q -ra
          -m "not slow and not heavy" --ignore=sjtu_tpmshx/tests/integration_tm1
          -n 2 --dist loadscope --max-worker-restart=0
          -p sjtu_tpmshx.tests.ci_shard --ci-manifest=.cache/ci/fast-manifest
          --ci-covered-modules=sjtu_tpmshx/tests/native/_ci_suite.txt
          --ci-shard=${{ matrix.part == 'fast-0' && '0' || '1' }}
          --timeout=600 --timeout-method=thread
          --durations=30 --junitxml=.cache/ci/fast.xml
      - name: Run real public module integration
        if: matrix.part == 'integration'
        shell: bash
        run: >-
          "$CI_PYTHON" -m pytest sjtu_tpmshx/tests/integration_tm1 -q -ra
          -p sjtu_tpmshx.tests.ci_shard --ci-manifest=.cache/ci/integration-manifest
          --basetemp=.cache/real-file-handoff
          --timeout=600 --timeout-method=thread
          --durations=30 --junitxml=.cache/ci/integration.xml
      - name: Save real native result files for isolated postprocessing
        if: runner.os == 'macOS' && matrix.part == 'integration'
        uses: actions/upload-artifact@v7
        with:
          name: real-file-handoff
          # Pytest's current links duplicate the producer files.
          path: |
            .cache/real-file-handoff/**/handoff/results.h5
            .cache/real-file-handoff/**/handoff/metrics.json
            !.cache/real-file-handoff/**/*current/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Save test outcomes and timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ inputs.os }}-py${{ matrix.python }}-${{ matrix.part }}
          path: .cache/ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
