# Build and qualify one platform without waiting for other platform builds.
name: native

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      tier:
        required: true
        type: string

jobs:
  native-build:
    name: native-build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      MPLCONFIGDIR: .cache/matplotlib
      XDG_CACHE_HOME: .cache/xdg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TPMSHX_REQUIRE_NATIVE_DEPS_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Activate MSVC for native qualification
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'The required MSVC compiler is missing' }
          & "$installation\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          'CXX=cl' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: engineering/requirements/base.txt
      - name: Create isolated native qualification environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sjtu-native-ci-venv"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'sjtu-native-ci-venv'
          interpreter = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          Path('.venv-path').write_text(interpreter.as_posix() + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'CI_PYTHON={interpreter.as_posix()}\n')
          PY
      - name: Install locked qualification dependencies
        shell: bash
        run: '"$CI_PYTHON" -m pip install -r engineering/requirements/base.txt'
      - name: Check exact dependency lock
        shell: bash
        run: '"$CI_PYTHON" -m sjtu_tpmshx.development.runs.tools.check_locked_environment engineering/requirements/base.txt'
      - name: Check dependency compatibility
        shell: bash
        run: '"$CI_PYTHON" -m pip check'
      - name: Check source and wheel distribution contents
        shell: bash
        run: '"$CI_PYTHON" engineering/scripts/check_distributions.py --output-dir .cache/distribution-check'
      - name: Check installed wheel entry points and resources
        shell: bash
        env:
          TM1_WHEEL_DIR: .cache/distribution-check
        run: '"$CI_PYTHON" -m pytest sjtu_tpmshx/development/tests/test_distribution_contents.py -q'
      - name: Save Python wheels for isolated postprocessing
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions-${{ inputs.os }}
          path: |
            .cache/distribution-check/wheel-direct/*.whl
            .cache/distribution-check/wheel-from-sdist/*.whl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Fetch the locked build tool for the independent result core
        shell: bash
        run: '"$CI_PYTHON" engineering/scripts/build_native_dependencies.py fetch-cmake --component result'
      - name: Build and verify the independent result library offline
        shell: bash
        run: '"$CI_PYTHON" engineering/scripts/build_native_dependencies.py publish --component result'
      - name: Check result numerical contracts before the full native build
        shell: bash
        run: >-
          "$CI_PYTHON" -m pytest -q --junitxml=.cache/native-deps/logs/result-contracts.xml
          sjtu_tpmshx/development/tests/native/test_result_metrics.py
          sjtu_tpmshx/development/tests/native/test_result_checks.py
          sjtu_tpmshx/development/tests/test_native_result_balance.py
          sjtu_tpmshx/development/tests/test_native_zone_statistics.py
          sjtu_tpmshx/development/tests/test_native_result_loader.py
      - name: Fetch fixed native sources and build tool
        shell: bash
        run: '"$CI_PYTHON" engineering/scripts/build_native_dependencies.py fetch'
      - name: Record hosted toolchain image
        id: toolchain
        shell: bash
        run: echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Cache locked CoolProp static library
        id: coolprop
        uses: actions/cache@v6
        with:
          path: |
            .cache/native-deps/build/coolprop-macos-arm64/libCoolProp.a
            .cache/native-deps/build/coolprop-macos-arm64/coolprop-build.json
            .cache/native-deps/build/coolprop-preparation-macos-arm64/libCoolProp.a
            .cache/native-deps/build/coolprop-preparation-macos-arm64/coolprop-build.json
            .cache/native-deps/build/coolprop-windows-x64/Release/CoolProp.lib
            .cache/native-deps/build/coolprop-windows-x64/coolprop-build.json
          key: coolprop-${{ runner.os }}-${{ runner.arch }}-py3.13-${{ steps.toolchain.outputs.image }}-${{ hashFiles('sjtu_tpmshx/solvers/native/dependencies-lock.toml', 'engineering/scripts/build_native_dependencies.py') }}
      - name: Build locked CoolProp on cache miss
        if: steps.coolprop.outputs.cache-hit != 'true'
        shell: bash
        run: '"$CI_PYTHON" engineering/scripts/build_native_dependencies.py build --component coolprop'
      - name: Build current project libraries and callers offline
        shell: bash
        run: '"$CI_PYTHON" engineering/scripts/build_native_dependencies.py build --component pilot'
      - name: Run independent native callers
        shell: bash
        run: '"$CI_PYTHON" engineering/scripts/build_native_dependencies.py verify'
      - name: Check the installed C++ stage SDK outside the source tree
        shell: bash
        run: '"$CI_PYTHON" engineering/scripts/build_native_dependencies.py check-stages'
      - name: Compare native preparation and complete stage results
        shell: bash
        run: |
          "$CI_PYTHON" - <<'PYTHON'
          import os
          from pathlib import Path
          host = 'windows-x64' if os.name == 'nt' else 'macos-arm64'
          prefix, suffix = ('', '.dll') if os.name == 'nt' else ('lib', '.dylib')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for component in ('solver', 'geometry', 'preparation', 'result'):
                  folder = component if component in ('preparation', 'result') else 'pilot'
                  library = Path('.cache/native-deps/build') / (folder + '-' + host) / (prefix + 'tpmshx_' + component + '_shared' + suffix)
                  name = 'TPMSHX_NATIVE_SOLVER_LIBRARY' if component == 'solver' else 'TPMSHX_' + component.upper() + '_LIBRARY'
                  output.write(f'{name}={library.resolve().as_posix()}\n')
          PYTHON
      - name: Check exact stage contracts
        shell: bash
        run: >-
          "$CI_PYTHON" -m pytest -q --junitxml=.cache/native-deps/logs/stage-contracts.xml
          sjtu_tpmshx/development/tests/test_native_preparation_case.py
          sjtu_tpmshx/development/tests/test_native_preparation_fluids.py
          sjtu_tpmshx/development/tests/test_native_preparation_mass_flow.py
          sjtu_tpmshx/development/tests/test_native_preparation_continuous.py
          sjtu_tpmshx/development/tests/test_native_preparation_3d.py
          sjtu_tpmshx/development/tests/test_native_prepare_adapter.py
          sjtu_tpmshx/development/tests/test_preparation_cache.py
          sjtu_tpmshx/development/tests/test_native_stage_run.py
          sjtu_tpmshx/development/tests/test_native_stage_uniform.py
          sjtu_tpmshx/development/tests/test_native_stage_continuous.py
          sjtu_tpmshx/development/tests/test_native_stage_state.py
          sjtu_tpmshx/development/tests/test_native_stage_capture.py
          sjtu_tpmshx/development/tests/test_native_run_adapter.py
          sjtu_tpmshx/development/tests/test_native_result_stage.py
          sjtu_tpmshx/development/tests/test_native_result_stage_host.py
          sjtu_tpmshx/development/tests/test_native_quick_result_stage.py
      - name: Pack native runtime files with executable permissions
        shell: bash
        run: |
          "$CI_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          import tarfile
          host = 'windows-x64' if os.name == 'nt' else 'macos-arm64'
          build = Path('.cache/native-deps/build') / ('pilot-' + host)
          preparation = build.with_name('preparation-' + host)
          result = build.with_name('result-' + host)
          prefix, suffix = ('', '.dll') if os.name == 'nt' else ('lib', '.dylib')
          libraries = (
              'tpmshx_solver_shared', 'tpmshx_geometry_shared', 'tpmshx_model_h_shared',
              'tpmshx_enthalpy_shared', 'tpmshx_temperature_shared', 'tpmshx_full_2d_shared',
              'tpmshx_simple_2d_shared', 'tpmshx_simple_3d_shared', 'model_h_2d_test',
              'model_h_3d_test', 'model_h_2d_history_test', 'model_h_3d_history_test',
              'temperature_staggered_test', 'full_3d_test',
              'refinement_2d_test', 'full_2d_test', 'enthalpy_driver_test',
              'quick_design_test', 'simple_2d_test', 'simple_3d_test',
          )
          callers = (
              'geometry_c_static', 'geometry_c_shared', 'geometry_kernel_smoke',
              'eos_smoke', 'fluid_properties_smoke', 'pressure_smoke', 'temperature_driver_smoke',
              'quick_design_c_static', 'quick_design_c_shared', 'quick_design_driver_smoke',
              'enthalpy_c_static', 'enthalpy_c_shared', 'enthalpy_driver_smoke',
              'conservative_energy_smoke', 'conservative_energy_driver_smoke',
              'simple_2d_smoke', 'simple_3d_smoke', 'simple_run_smoke',
              'simple_2d_c_static', 'simple_2d_c_shared', 'simple_3d_c_static', 'simple_3d_c_shared',
              'model_h_2d_smoke', 'model_h_3d_smoke', 'model_h_chunk_smoke', 'model_h_run_smoke',
              'model_h_c_static', 'model_h_c_shared', 'temperature_c_static', 'temperature_c_shared',
              'temperature_staggered_smoke', 'temperature_run_smoke',
              'full_2d_c_static', 'full_2d_c_shared', 'full_3d_c_static', 'full_3d_c_shared',
              'side_physics_smoke', 'superlu_error_smoke',
          )
          executable_suffix = '.exe' if os.name == 'nt' else ''
          files = [build / (prefix + name + suffix) for name in libraries]
          files += [build / (name + executable_suffix) for name in callers]
          files += [preparation / (prefix + 'tpmshx_preparation_shared' + suffix)]
          files += [preparation / (name + executable_suffix) for name in ('preparation_c_static', 'preparation_c_shared')]
          files += [result / (prefix + 'tpmshx_result_shared' + suffix)]
          files += [result / (name + executable_suffix) for name in ('result_c_static', 'result_c_shared', 'result_kernel_smoke')]
          files += sorted((build.parent / 'stage-result').iterdir())
          files += [build.parent / ('coolprop-' + host) / 'coolprop-build.json']
          if host == 'macos-arm64':
              files += [build.parent / ('coolprop-preparation-' + host) / 'coolprop-build.json']
          missing = [str(path) for path in files if not path.is_file()]
          assert not missing, f'Missing native runtime files: {missing}'
          archive = Path('.cache/ci-native-build/native-binaries.tar')
          archive.parent.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive, 'w') as output:
              for path in files:
                  output.add(path, arcname=path.relative_to(build.parent), recursive=False)
              output.add('LICENSE', arcname='LICENSE')
              output.add('sjtu_tpmshx/solvers/native/THIRD_PARTY_NOTICES.md', arcname='THIRD_PARTY_NOTICES.md')
              output.add('sjtu_tpmshx/solvers/native/dependencies-lock.toml', arcname='dependencies-lock.toml')
              output.add('sjtu_tpmshx/solvers/native/licenses', arcname='licenses')
              for record in ('preparation/sources.md', 'geometry/README.md', 'geometry/fields-sources.md', 'result/sources.md'):
                  output.add(Path('sjtu_tpmshx/solvers/native') / record, arcname=record, recursive=False)
          print(f'Packed {len(files)} native runtime files ({archive.stat().st_size} bytes)')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: native-build-${{ inputs.os }}
          path: .cache/ci-native-build/native-binaries.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Save native build and independent caller logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-build-logs-${{ inputs.os }}
          path: |
            .cache/native-deps/logs/
            .cache/distribution-check/inventory.json
            .cache/distribution-check/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  native-dependencies:
    needs: native-build
    if: inputs.tier == 'full'
    name: native-dependencies (${{ matrix.python }}, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.os == 'macos-15' && '["3.13"]' || '["3.12","3.13"]') }}
        shard: ${{ fromJSON(inputs.os == 'macos-15' && '[0,1,2]' || '[0,1,2,3,4]') }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    env:
      NATIVE_SHARD_SET: ${{ inputs.os == 'macos-15' && 'macos' || 'windows' }}
      PYTHONHASHSEED: "0"
      MPLCONFIGDIR: .cache/matplotlib
      XDG_CACHE_HOME: .cache/xdg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TPMSHX_REQUIRE_NATIVE_DEPS_TESTS: "1"
      TPMSHX_REQUIRE_CPP_TESTS: "1"
      QT_QPA_PLATFORM: offscreen
      TPMSHX_DISABLE_3D_PANEL: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Activate MSVC for native qualification
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'The required MSVC compiler is missing' }
          & "$installation\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          'CXX=cl' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: engineering/requirements/base.txt
      - name: Create isolated native qualification environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sjtu-native-ci-venv"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'sjtu-native-ci-venv'
          interpreter = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          Path('.venv-path').write_text(interpreter.as_posix() + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'CI_PYTHON={interpreter.as_posix()}\n')
          PY
      - name: Install locked qualification dependencies
        shell: bash
        run: '"$CI_PYTHON" -m pip install -r engineering/requirements/base.txt'
      - name: Check exact dependency lock
        shell: bash
        run: '"$CI_PYTHON" -m sjtu_tpmshx.development.runs.tools.check_locked_environment engineering/requirements/base.txt'
      - name: Check dependency compatibility
        shell: bash
        run: '"$CI_PYTHON" -m pip check'
      - uses: actions/download-artifact@v8
        with:
          name: native-build-${{ inputs.os }}
          path: .cache/ci-native-build
      - name: Restore native runtime files
        shell: bash
        run: |
          "$CI_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import tarfile
          with tarfile.open('.cache/ci-native-build/native-binaries.tar') as archive:
              archive.extractall('.cache/native-deps/build', filter='data')
          host = 'windows-x64' if os.name == 'nt' else 'macos-arm64'
          target = Path('sjtu_tpmshx/solvers/native/lib') / host
          target.mkdir(parents=True, exist_ok=True)
          prefix, suffix = ('', '.dll') if os.name == 'nt' else ('lib', '.dylib')
          for component in ('solver', 'geometry', 'preparation', 'result'):
              name = prefix + 'tpmshx_' + component + '_shared' + suffix
              folder = component if component in ('preparation', 'result') else 'pilot'
              shutil.copy2(Path('.cache/native-deps/build') / (folder + '-' + host) / name, target / name)
          PY
      - name: Fetch locked Eigen headers for fixture-built libraries
        shell: bash
        run: '"$CI_PYTHON" engineering/scripts/build_native_dependencies.py fetch-eigen'
      - name: Require explicit native libraries for thermal evidence tests
        shell: bash
        run: |
          "$CI_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          host = 'windows-x64' if os.name == 'nt' else 'macos-arm64'
          prefix, suffix = ('', '.dll') if os.name == 'nt' else ('lib', '.dylib')
          build = Path('.cache/native-deps/build') / ('pilot-' + host)
          libraries = {
              'TPMSHX_NATIVE_SOLVER_LIBRARY': build / (prefix + 'tpmshx_solver_shared' + suffix),
              'TPMSHX_GEOMETRY_LIBRARY': build / (prefix + 'tpmshx_geometry_shared' + suffix),
              'TPMSHX_PREPARATION_LIBRARY': build.with_name('preparation-' + host) / (prefix + 'tpmshx_preparation_shared' + suffix),
              'TPMSHX_RESULT_LIBRARY': build.with_name('result-' + host) / (prefix + 'tpmshx_result_shared' + suffix),
              'TPMSHX_MODEL_H_PUBLIC_LIBRARY': build / (prefix + 'tpmshx_model_h_shared' + suffix),
          }
          for name, path in libraries.items():
              if not path.is_file():
                  raise FileNotFoundError(f'{name}: native library not built: {path}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for name, path in libraries.items():
                  output.write(f'{name}={path.resolve().as_posix()}\n')
          PY
      - name: Require native property, flow and thermal qualification
        shell: bash
        run: |
          shard_options=()
          for group in sjtu_tpmshx/development/tests/native/_ci_"$NATIVE_SHARD_SET"_shard*.txt; do
            shard_options+=("--ci-shard-modules=$group")
          done
          "$CI_PYTHON" -m pytest -q -ra -n 2 --dist loadscope --max-worker-restart=0 \
          @sjtu_tpmshx/development/tests/native/_ci_suite.txt \
          -p sjtu_tpmshx.development.tests.ci_shard --ci-shard=${{ matrix.shard }} \
          "${shard_options[@]}" \
          --ci-manifest=.cache/ci/native-manifest \
          --timeout=600 --timeout-method=thread --durations=20 \
          --junitxml=.cache/ci/native-dependencies.xml
      - name: Save native qualification outcomes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-dependencies-${{ inputs.os }}-py${{ matrix.python }}-shard-${{ matrix.shard }}
          path: .cache/ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  test-parts:
    needs: native-build
    name: test-part (${{ inputs.os }}, ${{ matrix.python }}, ${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.os == 'macos-15' && '["3.13"]' || '["3.12","3.13"]') }}
        part: [fast-0, fast-1]
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      MPLCONFIGDIR: .cache/matplotlib
      XDG_CACHE_HOME: .cache/xdg
      QT_QPA_PLATFORM: offscreen
      TPMSHX_DISABLE_3D_PANEL: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TPMSHX_REQUIRE_CPP_TESTS: "1"
      TPMSHX_REQUIRE_NATIVE_DEPS_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Activate MSVC for native tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'The required MSVC compiler is missing' }
          & "$installation\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          'CXX=cl' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            engineering/requirements/base.txt
            pyproject.toml
      - name: Create isolated CI environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sjtu-ci-venv"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'sjtu-ci-venv'
          interpreter = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          Path('.venv-path').write_text(interpreter.as_posix() + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'CI_PYTHON={interpreter.as_posix()}\n')
          PY
      - name: Install project
        shell: bash
        run: '"$CI_PYTHON" -m pip install -r requirements.txt'
      - name: Check exact dependency lock
        shell: bash
        run: '"$CI_PYTHON" -m sjtu_tpmshx.development.runs.tools.check_locked_environment engineering/requirements/base.txt --allow-extra sjtu-tpmshx'
      - name: Check dependency compatibility
        shell: bash
        run: '"$CI_PYTHON" -m pip check'
      - uses: actions/download-artifact@v8
        with:
          name: native-build-${{ inputs.os }}
          path: .cache/ci-native-build
      - name: Restore native runtime files
        shell: bash
        run: |
          "$CI_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import tarfile
          with tarfile.open('.cache/ci-native-build/native-binaries.tar') as archive:
              archive.extractall('.cache/native-deps/build', filter='data')
          host = 'windows-x64' if os.name == 'nt' else 'macos-arm64'
          target = Path('sjtu_tpmshx/solvers/native/lib') / host
          target.mkdir(parents=True, exist_ok=True)
          prefix, suffix = ('', '.dll') if os.name == 'nt' else ('lib', '.dylib')
          for component in ('solver', 'geometry', 'preparation', 'result'):
              name = prefix + 'tpmshx_' + component + '_shared' + suffix
              folder = component if component in ('preparation', 'result') else 'pilot'
              shutil.copy2(Path('.cache/native-deps/build') / (folder + '-' + host) / name, target / name)
          PY
      - name: Require explicit native libraries for thermal evidence tests
        shell: bash
        run: |
          "$CI_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          host = 'windows-x64' if os.name == 'nt' else 'macos-arm64'
          prefix, suffix = ('', '.dll') if os.name == 'nt' else ('lib', '.dylib')
          build = Path('.cache/native-deps/build') / ('pilot-' + host)
          libraries = {
              'TPMSHX_NATIVE_SOLVER_LIBRARY': build / (prefix + 'tpmshx_solver_shared' + suffix),
              'TPMSHX_GEOMETRY_LIBRARY': build / (prefix + 'tpmshx_geometry_shared' + suffix),
              'TPMSHX_PREPARATION_LIBRARY': build.with_name('preparation-' + host) / (prefix + 'tpmshx_preparation_shared' + suffix),
              'TPMSHX_RESULT_LIBRARY': build.with_name('result-' + host) / (prefix + 'tpmshx_result_shared' + suffix),
              'TPMSHX_MODEL_H_PUBLIC_LIBRARY': build / (prefix + 'tpmshx_model_h_shared' + suffix),
          }
          for name, path in libraries.items():
              if not path.is_file():
                  raise FileNotFoundError(f'{name}: native library not built: {path}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for name, path in libraries.items():
                  output.write(f'{name}={path.resolve().as_posix()}\n')
          PY
      - name: Fetch locked Eigen headers for native temperature tests
        shell: bash
        run: '"$CI_PYTHON" engineering/scripts/build_native_dependencies.py fetch-eigen'
      - name: Build and run independent C++ callers on macOS
        if: runner.os == 'macOS' && matrix.part == 'fast-0'
        run: make -f sjtu_tpmshx/solvers/native/Makefile check
      - name: Build and run independent C++ callers on Windows
        if: runner.os == 'Windows' && matrix.part == 'fast-0'
        shell: cmd
        run: nmake /f sjtu_tpmshx\solvers\native\Makefile.msvc check
      - name: Install fixed Mesa OpenGL for actual Qt rendering
        if: runner.os == 'Windows' && matrix.part == 'fast-1'
        uses: pyvista/setup-headless-display-action@c103a2ff45650d38cb71684b5dc6cdfeb9442c79 # v5.1
        with:
          mesa3d-release: '25.0.7'
          install-mesa3d-offscreen: 'false'
          pyvista: 'false'
      - name: Run fast test subset
        shell: bash
        run: >-
          "$CI_PYTHON" -m pytest sjtu_tpmshx/development/tests/ -q -ra
          -m "not slow and not heavy" --ignore=sjtu_tpmshx/development/tests/integration_tm1
          -n 2 ${{ matrix.part == 'fast-0' && '--dist load --maxschedchunk=1' || '--dist worksteal' }} --max-worker-restart=0
          -p sjtu_tpmshx.development.tests.ci_shard --ci-manifest=.cache/ci/fast/fast-manifest
          --ci-covered-modules=sjtu_tpmshx/development/tests/native/_ci_suite.txt
          --ci-shard=${{ matrix.part == 'fast-0' && '0' || '1' }}
          --timeout=600 --timeout-method=thread
          --durations=30 --junitxml=.cache/ci/fast/fast.xml
      - name: Save fast test outcomes and timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ inputs.os }}-py${{ matrix.python }}-${{ matrix.part }}
          path: .cache/ci/fast/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Run real public module integration
        id: integration
        # Keep integration evidence when fast tests fail.
        if: ${{ !cancelled() && matrix.part == 'fast-1' }}
        shell: bash
        run: >-
          "$CI_PYTHON" -m pytest sjtu_tpmshx/development/tests/integration_tm1 -q -ra
          -p sjtu_tpmshx.development.tests.ci_shard --ci-manifest=.cache/ci/integration/integration-manifest
          --basetemp=.cache/real-file-handoff
          --timeout=600 --timeout-method=thread
          --durations=30 --junitxml=.cache/ci/integration/integration.xml
      - name: Save real native result files for isolated postprocessing
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.integration.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: real-file-handoff
          # Pytest's current links duplicate the producer files.
          path: |
            .cache/real-file-handoff/**/handoff/results.h5
            .cache/real-file-handoff/**/handoff/metrics.json
            !.cache/real-file-handoff/**/*current/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Save integration outcomes and timings
        if: always() && matrix.part == 'fast-1'
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ inputs.os }}-py${{ matrix.python }}-integration
          path: .cache/ci/integration/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
