# Build and qualify one platform without waiting for other platform builds.
name: native

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      tier:
        required: true
        type: string

jobs:
  native-build:
    name: native-build
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    env:
      PYTHONHASHSEED: "0"
      MPLCONFIGDIR: .cache/matplotlib
      XDG_CACHE_HOME: .cache/xdg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TPMSHX_REQUIRE_NATIVE_DEPS_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Activate MSVC for native qualification
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'The required MSVC compiler is missing' }
          & "$installation\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          'CXX=cl' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: engineering/requirements/base.txt
      - name: Create isolated native qualification environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sjtu-native-ci-venv"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'sjtu-native-ci-venv'
          interpreter = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          Path('.venv-path').write_text(interpreter.as_posix() + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'CI_PYTHON={interpreter.as_posix()}\n')
          PY
      - name: Install locked qualification dependencies
        shell: bash
        run: '"$CI_PYTHON" -m pip install --no-compile -r engineering/requirements/base.txt'
      - name: Check exact dependency lock
        shell: bash
        run: '"$CI_PYTHON" -m sjtu_tpmshx.development.runs.tools.check_locked_environment engineering/requirements/base.txt'
      - name: Check dependency compatibility
        shell: bash
        run: '"$CI_PYTHON" -m pip check'
      - name: Check source and wheel distribution contents
        shell: bash
        run: '"$CI_PYTHON" engineering/scripts/check_distributions.py --output-dir .cache/distribution-check'
      - name: Check installed wheel entry points and resources
        shell: bash
        env:
          TM1_WHEEL_DIR: .cache/distribution-check
        run: '"$CI_PYTHON" -m pytest tests/python/test_distribution_contents.py -q'
      - name: Save Python wheels for isolated postprocessing
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions-${{ inputs.os }}
          path: |
            .cache/distribution-check/wheel-direct/*.whl
            .cache/distribution-check/wheel-from-sdist/*.whl
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Fetch fixed native sources and build tool
        shell: bash
        run: '"$CI_PYTHON" engineering/scripts/build_native_dependencies.py fetch'
      - name: Record hosted toolchain image and CoolProp inputs
        id: toolchain
        shell: bash
        run: |
          echo "image=$ImageVersion" >> "$GITHUB_OUTPUT"
          inputs=$("$CI_PYTHON" engineering/scripts/build_coolprop.py cache-key --host ${{ runner.os == 'Windows' && 'windows-x64' || 'macos-arm64' }} | tr -d '\r')
          echo "coolprop_inputs=$inputs" >> "$GITHUB_OUTPUT"
      - name: Cache locked CoolProp static library
        id: coolprop
        uses: actions/cache@v6
        with:
          path: |
            .cache/native-deps/build/coolprop-macos-arm64/libCoolProp.a
            .cache/native-deps/build/coolprop-macos-arm64/coolprop-build.json
            .cache/native-deps/build/coolprop-preparation-macos-arm64/libCoolProp.a
            .cache/native-deps/build/coolprop-preparation-macos-arm64/coolprop-build.json
            .cache/native-deps/build/coolprop-windows-x64/Release/CoolProp.lib
            .cache/native-deps/build/coolprop-windows-x64/coolprop-build.json
          key: coolprop-${{ runner.os }}-${{ runner.arch }}-py3.13-${{ steps.toolchain.outputs.image }}-${{ steps.toolchain.outputs.coolprop_inputs }}-${{ hashFiles('engineering/scripts/build_coolprop.py') }}
      - name: Build locked CoolProp on cache miss
        if: steps.coolprop.outputs.cache-hit != 'true'
        shell: bash
        run: '"$CI_PYTHON" engineering/scripts/build_native_dependencies.py build --component coolprop'
      - name: Build current project libraries and callers offline
        shell: bash
        run: '"$CI_PYTHON" engineering/scripts/build_native_dependencies.py build --component pilot'
      - name: Build the independent result library offline
        shell: bash
        run: '"$CI_PYTHON" engineering/scripts/build_native_dependencies.py build --component result'
      - name: Run independent native callers
        shell: bash
        run: '"$CI_PYTHON" engineering/scripts/build_native_dependencies.py verify'
      - name: Check the installed C++ stage SDK outside the source tree
        env:
          CTEST_PARALLEL_LEVEL: "2"
        shell: bash
        run: '"$CI_PYTHON" engineering/scripts/build_native_dependencies.py check-stages'
      - name: Pack native runtime files with executable permissions
        shell: bash
        run: |
          "$CI_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          import tarfile
          host = 'windows-x64' if os.name == 'nt' else 'macos-arm64'
          build = Path('.cache/native-deps/build') / ('pilot-' + host)
          preparation = build.with_name('preparation-' + host)
          result = build.with_name('result-' + host)
          prefix, suffix = ('', '.dll') if os.name == 'nt' else ('lib', '.dylib')
          libraries = (
              'tpmshx_solver_shared', 'tpmshx_geometry_shared', 'model_h_2d_test',
              'model_h_3d_test', 'model_h_2d_history_test', 'model_h_3d_history_test',
              'temperature_staggered_test', 'full_3d_test',
              'refinement_2d_test', 'full_2d_test', 'enthalpy_driver_test',
              'quick_design_test', 'simple_2d_test', 'simple_3d_test', 'tpmshx_kernel_test',
          )
          # These callers also run in downstream pytest jobs.
          callers = (
              'eos_smoke', 'fluid_properties_smoke', 'pressure_smoke',
              'quick_design_driver_smoke', 'simple_2d_smoke',
          )
          executable_suffix = '.exe' if os.name == 'nt' else ''
          files = [build / (prefix + name + suffix) for name in libraries]
          files += [build / (name + executable_suffix) for name in callers]
          files += [preparation / (prefix + 'tpmshx_preparation_shared' + suffix)]
          files += [result / (prefix + 'tpmshx_result_shared' + suffix)]
          files += sorted((build.parent / 'stage-result').iterdir())
          files += sorted((build.parent / 'quick-design-stage-result').glob('*/*'))
          files += [build.parent / ('coolprop-' + host) / 'coolprop-build.json']
          if host == 'macos-arm64':
              files += [build.parent / ('coolprop-preparation-' + host) / 'coolprop-build.json']
          missing = [str(path) for path in files if not path.is_file()]
          assert not missing, f'Missing native runtime files: {missing}'
          archive = Path('.cache/ci-native-build/native-binaries.tar')
          archive.parent.mkdir(parents=True, exist_ok=True)
          with tarfile.open(archive, 'w') as output:
              for path in files:
                  output.add(path, arcname=path.relative_to(build.parent), recursive=False)
              output.add('LICENSE', arcname='LICENSE')
              from engineering.scripts.build_native_dependencies import stage_native_notices
              notices = Path('.cache/native-deps/runtime-notices')
              for path in stage_native_notices(Path.cwd(), notices):
                  output.add(path, arcname=path.relative_to(notices), recursive=False)
          print(f'Packed {len(files)} native runtime files ({archive.stat().st_size} bytes)')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: native-build-${{ inputs.os }}
          path: .cache/ci-native-build/native-binaries.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Save native build and independent caller logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-build-logs-${{ inputs.os }}
          path: |
            .cache/native-deps/logs/
            .cache/distribution-check/inventory.json
            .cache/distribution-check/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  native-dependencies:
    needs: native-build
    if: inputs.tier == 'full'
    name: native-dependencies (3.13, ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.os == 'macos-15' && '[0,1,2]' || '[0,1,2,3,4,5]') }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 90
    env:
      NATIVE_SHARD_SET: ${{ inputs.os == 'macos-15' && 'macos' || 'windows' }}
      PYTHONHASHSEED: "0"
      MPLCONFIGDIR: .cache/matplotlib
      XDG_CACHE_HOME: .cache/xdg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TPMSHX_REQUIRE_NATIVE_DEPS_TESTS: "1"
      QT_QPA_PLATFORM: offscreen
      TPMSHX_DISABLE_3D_PANEL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: engineering/requirements/base.txt
      - name: Create isolated native qualification environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sjtu-native-ci-venv"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'sjtu-native-ci-venv'
          interpreter = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          Path('.venv-path').write_text(interpreter.as_posix() + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'CI_PYTHON={interpreter.as_posix()}\n')
          PY
      - name: Install locked qualification dependencies
        shell: bash
        run: '"$CI_PYTHON" -m pip install --no-compile -r engineering/requirements/base.txt'
      - name: Check exact dependency lock
        shell: bash
        run: '"$CI_PYTHON" -m sjtu_tpmshx.development.runs.tools.check_locked_environment engineering/requirements/base.txt'
      - name: Check dependency compatibility
        shell: bash
        run: '"$CI_PYTHON" -m pip check'
      - uses: actions/download-artifact@v8
        with:
          name: native-build-${{ inputs.os }}
          path: .cache/ci-native-build
      - name: Restore native runtime files
        shell: bash
        run: |
          "$CI_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import tarfile
          with tarfile.open('.cache/ci-native-build/native-binaries.tar') as archive:
              archive.extractall('.cache/native-deps/build', filter='data')
          host = 'windows-x64' if os.name == 'nt' else 'macos-arm64'
          target = Path('sjtu_tpmshx/solvers/native/lib') / host
          target.mkdir(parents=True, exist_ok=True)
          prefix, suffix = ('', '.dll') if os.name == 'nt' else ('lib', '.dylib')
          for component in ('solver', 'geometry', 'preparation', 'result'):
              name = prefix + 'tpmshx_' + component + '_shared' + suffix
              folder = component if component in ('preparation', 'result') else 'pilot'
              shutil.copy2(Path('.cache/native-deps/build') / (folder + '-' + host) / name, target / name)
          PY
      - name: Require explicit native libraries for thermal evidence tests
        shell: bash
        run: |
          "$CI_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          host = 'windows-x64' if os.name == 'nt' else 'macos-arm64'
          prefix, suffix = ('', '.dll') if os.name == 'nt' else ('lib', '.dylib')
          build = Path('.cache/native-deps/build') / ('pilot-' + host)
          libraries = {
              'TPMSHX_NATIVE_SOLVER_LIBRARY': build / (prefix + 'tpmshx_solver_shared' + suffix),
              'TPMSHX_GEOMETRY_LIBRARY': build / (prefix + 'tpmshx_geometry_shared' + suffix),
              'TPMSHX_PREPARATION_LIBRARY': build.with_name('preparation-' + host) / (prefix + 'tpmshx_preparation_shared' + suffix),
              'TPMSHX_RESULT_LIBRARY': build.with_name('result-' + host) / (prefix + 'tpmshx_result_shared' + suffix),
          }
          for name, path in libraries.items():
              if not path.is_file():
                  raise FileNotFoundError(f'{name}: native library not built: {path}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for name, path in libraries.items():
                  output.write(f'{name}={path.resolve().as_posix()}\n')
          PY
      - name: Require native property, flow and thermal qualification
        shell: bash
        run: |
          shard_options=()
          for group in tests/python/native/_ci_"$NATIVE_SHARD_SET"_shard*.txt; do
            shard_options+=("--ci-shard-modules=$group")
          done
          "$CI_PYTHON" -m pytest -q -ra -n 2 --dist loadscope --max-worker-restart=0 \
          @tests/python/native/_ci_suite.txt @tests/python/native/_ci_stage_suite.txt \
          -p tests.python.ci_shard --ci-shard=${{ matrix.shard }} \
          "${shard_options[@]}" \
          --ci-manifest=.cache/ci/native-manifest \
          --timeout=600 --timeout-method=thread --durations=20 \
          --junitxml=.cache/ci/native-dependencies.xml
      - name: Save native qualification outcomes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-dependencies-${{ inputs.os }}-py3.13-shard-${{ matrix.shard }}
          path: .cache/ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  test-parts:
    needs: native-build
    name: test-part (${{ inputs.os }}, ${{ matrix.python }}, ${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13']
        part: ${{ fromJSON(inputs.os == 'macos-15' && '["fast-0","fast-1"]' || '["fast-0","fast-1","integration"]') }}
        include: ${{ fromJSON(inputs.os == 'windows-2022' && '[{"python":"3.12","part":"integration"}]' || '[]') }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      MPLCONFIGDIR: .cache/matplotlib
      XDG_CACHE_HOME: .cache/xdg
      QT_QPA_PLATFORM: offscreen
      TPMSHX_DISABLE_3D_PANEL: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TPMSHX_REQUIRE_NATIVE_DEPS_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            engineering/requirements/base.txt
            engineering/requirements/bo-macos.txt
            pyproject.toml
      - uses: actions/download-artifact@v8
        with:
          name: native-build-${{ inputs.os }}
          path: .cache/ci-native-build
      # The full macOS tier runs BO here, before the solver library exists in this checkout.
      # The package discovers a published solver library without environment variables.
      - name: Restore geometry, preparation and result libraries for BO
        if: runner.os == 'macOS' && inputs.tier == 'full' && matrix.part == 'fast-0'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import tarfile
          target = Path('sjtu_tpmshx/solvers/native/lib/macos-arm64')
          with tarfile.open('.cache/ci-native-build/native-binaries.tar') as archive:
              for component in ('geometry', 'preparation', 'result'):
                  name = 'libtpmshx_' + component + '_shared.dylib'
                  folder = component if component in ('preparation', 'result') else 'pilot'
                  member = folder + '-macos-arm64/' + name
                  archive.extract(archive.getmember(member), '.cache/native-deps/build', filter='data')
                  target.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(Path('.cache/native-deps/build') / member, target / name)
          solver = target / 'libtpmshx_solver_shared.dylib'
          assert not solver.exists(), f'BO tests must run without the solver library: {solver}'
          PY
      - name: Run optimizer and real acquisition tests in an isolated BO environment
        if: runner.os == 'macOS' && inputs.tier == 'full' && matrix.part == 'fast-0'
        shell: bash
        run: |
          # The standalone BO job does not require native solver callers.
          unset TPMSHX_REQUIRE_NATIVE_DEPS_TESTS
          python -m venv "$RUNNER_TEMP/sjtu-bo-ci-venv"
          bo_python="$RUNNER_TEMP/sjtu-bo-ci-venv/bin/python"
          "$bo_python" -m pip install -r engineering/requirements/bo-macos.txt
          "$bo_python" -m sjtu_tpmshx.development.runs.tools.check_locked_environment engineering/requirements/bo-macos.txt
          "$bo_python" -m pip check
          "$bo_python" -c 'import torch, botorch, gpytorch; print(f"torch={torch.__version__} botorch={botorch.__version__} gpytorch={gpytorch.__version__}")'
          library=sjtu_tpmshx/solvers/native/lib/macos-arm64
          TPMSHX_GEOMETRY_LIBRARY="$PWD/$library/libtpmshx_geometry_shared.dylib" \
          TPMSHX_PREPARATION_LIBRARY="$PWD/$library/libtpmshx_preparation_shared.dylib" \
          TPMSHX_RESULT_LIBRARY="$PWD/$library/libtpmshx_result_shared.dylib" \
          "$bo_python" -m pytest tests/python/test_multi_condition_optimizer.py \
            tests/python/test_mass_design.py -q -ra \
            -p tests.python.ci_shard --ci-manifest=.cache/ci/bo/bo-manifest \
            --timeout=600 --timeout-method=thread \
            --durations=10 --junitxml=.cache/ci/bo/bo.xml
      - name: Save BO test outcomes and timings
        if: always() && runner.os == 'macOS' && inputs.tier == 'full' && matrix.part == 'fast-0'
        uses: actions/upload-artifact@v7
        with:
          name: bo-test-reports-${{ inputs.os }}-py${{ matrix.python }}
          path: .cache/ci/bo/
          include-hidden-files: true
          retention-days: 7
      - name: Create isolated CI environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sjtu-ci-venv"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'sjtu-ci-venv'
          interpreter = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          Path('.venv-path').write_text(interpreter.as_posix() + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'CI_PYTHON={interpreter.as_posix()}\n')
          PY
      - name: Install project
        shell: bash
        run: '"$CI_PYTHON" -m pip install --no-compile -r requirements.txt'
      - name: Check exact dependency lock
        shell: bash
        run: '"$CI_PYTHON" -m sjtu_tpmshx.development.runs.tools.check_locked_environment engineering/requirements/base.txt --allow-extra sjtu-tpmshx'
      - name: Check dependency compatibility
        shell: bash
        run: '"$CI_PYTHON" -m pip check'
      - name: Restore native runtime files
        shell: bash
        run: |
          "$CI_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import tarfile
          with tarfile.open('.cache/ci-native-build/native-binaries.tar') as archive:
              archive.extractall('.cache/native-deps/build', filter='data')
          host = 'windows-x64' if os.name == 'nt' else 'macos-arm64'
          target = Path('sjtu_tpmshx/solvers/native/lib') / host
          target.mkdir(parents=True, exist_ok=True)
          prefix, suffix = ('', '.dll') if os.name == 'nt' else ('lib', '.dylib')
          for component in ('solver', 'geometry', 'preparation', 'result'):
              name = prefix + 'tpmshx_' + component + '_shared' + suffix
              folder = component if component in ('preparation', 'result') else 'pilot'
              shutil.copy2(Path('.cache/native-deps/build') / (folder + '-' + host) / name, target / name)
          PY
      - name: Require explicit native libraries for thermal evidence tests
        id: native-env
        shell: bash
        run: |
          "$CI_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          host = 'windows-x64' if os.name == 'nt' else 'macos-arm64'
          prefix, suffix = ('', '.dll') if os.name == 'nt' else ('lib', '.dylib')
          build = Path('.cache/native-deps/build') / ('pilot-' + host)
          libraries = {
              'TPMSHX_NATIVE_SOLVER_LIBRARY': build / (prefix + 'tpmshx_solver_shared' + suffix),
              'TPMSHX_GEOMETRY_LIBRARY': build / (prefix + 'tpmshx_geometry_shared' + suffix),
              'TPMSHX_PREPARATION_LIBRARY': build.with_name('preparation-' + host) / (prefix + 'tpmshx_preparation_shared' + suffix),
              'TPMSHX_RESULT_LIBRARY': build.with_name('result-' + host) / (prefix + 'tpmshx_result_shared' + suffix),
          }
          for name, path in libraries.items():
              if not path.is_file():
                  raise FileNotFoundError(f'{name}: native library not built: {path}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for name, path in libraries.items():
                  output.write(f'{name}={path.resolve().as_posix()}\n')
          PY
      - name: Install fixed Mesa OpenGL for actual Qt rendering
        if: runner.os == 'Windows' && (matrix.part == 'fast-1' || matrix.python == '3.12')
        uses: pyvista/setup-headless-display-action@c103a2ff45650d38cb71684b5dc6cdfeb9442c79 # v5.1
        with:
          mesa3d-release: '25.0.7'
          install-mesa3d-offscreen: 'false'
          pyvista: 'false'
      - name: Run fast test subset
        id: fast
        if: matrix.part != 'integration'
        shell: bash
        run: >-
          "$CI_PYTHON" -m pytest tests/python/ -q -ra
          -m "not slow and not heavy" --ignore=tests/python/integration_tm1
          -n 2 ${{ matrix.part == 'fast-0' && '--dist load --maxschedchunk=1' || '--dist worksteal' }} --max-worker-restart=0
          -p tests.python.ci_shard --ci-manifest=.cache/ci/fast/fast-manifest
          --ci-covered-modules=tests/python/native/_ci_suite.txt
          ${{ inputs.tier == 'full' && '--ci-covered-modules=tests/python/native/_ci_stage_suite.txt' || '' }}
          --ci-shard=${{ matrix.part == 'fast-0' && '0' || '1' }}
          --timeout=600 --timeout-method=thread
          --durations=30 --junitxml=.cache/ci/fast/fast.xml
      - name: Save fast test outcomes and timings
        if: always() && matrix.part != 'integration' && steps.fast.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ inputs.os }}-py${{ matrix.python }}-${{ matrix.part }}
          path: .cache/ci/fast/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Run real public module integration
        id: integration
        if: ${{ (success() && matrix.part == 'integration') || (!cancelled() && runner.os == 'macOS' && matrix.part == 'fast-0' && steps.native-env.outcome == 'success') }}
        shell: bash
        run: >-
          "$CI_PYTHON" -m pytest tests/python/integration_tm1 -q -ra
          ${{ matrix.python == '3.12' && '@tests/python/_ci_windows_312.txt' || '' }}
          -p tests.python.ci_shard --ci-manifest=.cache/ci/integration/integration-manifest
          --basetemp=.cache/real-file-handoff
          --timeout=600 --timeout-method=thread
          --durations=30 --junitxml=.cache/ci/integration/integration.xml
      - name: Save real native result files for isolated postprocessing
        if: ${{ !cancelled() && runner.os == 'macOS' && steps.integration.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: real-file-handoff
          # Pytest's current links duplicate the producer files.
          path: |
            .cache/real-file-handoff/**/handoff/results.h5
            .cache/real-file-handoff/**/handoff/metrics.json
            !.cache/real-file-handoff/**/*current/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Save integration outcomes and timings
        if: always() && steps.integration.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ inputs.os }}-py${{ matrix.python }}-integration
          path: .cache/ci/integration/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  bo-tests:
    needs: native-build
    # The full macOS tier runs these tests in test-parts fast-0.
    if: inputs.os != 'macos-15' || inputs.tier != 'full'
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(inputs.os == 'macos-15' && '["3.13"]' || '["3.12","3.13"]') }}
    runs-on: ${{ inputs.os }}
    timeout-minutes: 30
    env:
      BO_LOCK: ${{ inputs.os == 'macos-15' && 'engineering/requirements/bo-macos.txt' || 'engineering/requirements/bo-windows.txt' }}
      PYTHONHASHSEED: "0"
      MPLCONFIGDIR: .cache/matplotlib
      XDG_CACHE_HOME: .cache/xdg
      QT_QPA_PLATFORM: offscreen
      TPMSHX_DISABLE_3D_PANEL: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            engineering/requirements/base.txt
            ${{ env.BO_LOCK }}
      - name: Create isolated BO environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sjtu-bo-ci-venv"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'sjtu-bo-ci-venv'
          interpreter = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'CI_PYTHON={interpreter.as_posix()}\n')
          PY
      - name: Install locked BO dependencies
        shell: bash
        run: '"$CI_PYTHON" -m pip install -r "${{ env.BO_LOCK }}"'
      - name: Check exact BO dependency lock
        shell: bash
        run: '"$CI_PYTHON" -m sjtu_tpmshx.development.runs.tools.check_locked_environment "${{ env.BO_LOCK }}"'
      - name: Check dependency compatibility
        shell: bash
        run: '"$CI_PYTHON" -m pip check'
      - uses: actions/download-artifact@v8
        with:
          name: native-build-${{ inputs.os }}
          path: .cache/ci-native-build
      - name: Restore verified geometry, preparation and result libraries for BO
        shell: bash
        run: |
          "$CI_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import tarfile
          host = 'windows-x64' if os.name == 'nt' else 'macos-arm64'
          prefix, suffix = ('', '.dll') if os.name == 'nt' else ('lib', '.dylib')
          with tarfile.open('.cache/ci-native-build/native-binaries.tar') as archive:
              for component in ('geometry', 'preparation', 'result'):
                  name = prefix + 'tpmshx_' + component + '_shared' + suffix
                  folder = component if component in ('preparation', 'result') else 'pilot'
                  member = folder + '-' + host + '/' + name
                  archive.extract(archive.getmember(member), '.cache/native-deps/build', filter='data')
                  source = Path('.cache/native-deps/build') / member
                  target = Path('sjtu_tpmshx/solvers/native/lib') / host / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
                  with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
                      output.write(f'TPMSHX_{component.upper()}_LIBRARY={target.resolve().as_posix()}\n')
          PY
      - name: Require real BO imports
        shell: bash
        run: |
          "$CI_PYTHON" - <<'PY'
          import torch
          import botorch
          import gpytorch
          print(f'torch={torch.__version__} botorch={botorch.__version__} gpytorch={gpytorch.__version__}')
          PY
      - name: Run optimizer and real acquisition tests
        shell: bash
        run: >-
          "$CI_PYTHON" -m pytest tests/python/test_multi_condition_optimizer.py
          tests/python/test_mass_design.py -q -ra
          -p tests.python.ci_shard --ci-manifest=.cache/ci/bo-manifest
          --timeout=600 --timeout-method=thread
          --durations=10 --junitxml=.cache/ci/bo.xml
      - name: Save BO test outcomes and timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bo-test-reports-${{ inputs.os }}-py${{ matrix.python }}
          path: .cache/ci/
          include-hidden-files: true
          retention-days: 7
