# Complete supported-platform subsets, split across independent runners.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    uses: ./.github/workflows/native.yml
    with:
      os: ${{ matrix.os }}

  tests:
    # Keep the existing required check names; BO is now enforced by these gates.
    name: tests (${{ matrix.os }}, ${{ matrix.python }})
    needs: [bo-tests, native, minimal-postprocess]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: "3.13"
          - os: windows-2022
            python: "3.12"
          - os: windows-2022
            python: "3.13"
    steps:
      - name: Require application, native, BO and offline checks to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          failed = {name: job['result'] for name, job in json.loads(os.environ['NEEDS_JSON']).items()
                    if job['result'] != 'success'}
          if failed:
              raise SystemExit(f'Required test jobs did not succeed: {failed}')
          PY
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: test-reports-${{ matrix.os }}-py${{ matrix.python }}-fast-*
          path: .cache/ci-shards
      - uses: actions/download-artifact@v8
        with:
          pattern: native-dependencies-${{ matrix.os }}-py${{ matrix.python }}-shard-*
          path: .cache/ci-shards
      - name: Require complete and disjoint application and native coverage
        run: >-
          python scripts/check_ci_shards.py
          .cache/ci-shards/test-reports-${{ matrix.os }}-py${{ matrix.python }}-fast-0/fast-manifest
          .cache/ci-shards/test-reports-${{ matrix.os }}-py${{ matrix.python }}-fast-1/fast-manifest
          --covered-by
          .cache/ci-shards/native-dependencies-${{ matrix.os }}-py${{ matrix.python }}-shard-*/native-manifest

  bo-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: "3.13"
            lock: requirements/bo-macos.txt
          - os: windows-2022
            python: "3.12"
            lock: requirements/bo-windows.txt
          - os: windows-2022
            python: "3.13"
            lock: requirements/bo-windows.txt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      MPLCONFIGDIR: .cache/matplotlib
      XDG_CACHE_HOME: .cache/xdg
      QT_QPA_PLATFORM: offscreen
      TPMSHX_DISABLE_3D_PANEL: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements/base.txt
            ${{ matrix.lock }}
      - name: Create isolated BO environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sjtu-bo-ci-venv"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'sjtu-bo-ci-venv'
          interpreter = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'CI_PYTHON={interpreter.as_posix()}\n')
          PY
      - name: Install locked BO dependencies
        shell: bash
        run: '"$CI_PYTHON" -m pip install -r "${{ matrix.lock }}"'
      - name: Check exact BO dependency lock
        shell: bash
        run: '"$CI_PYTHON" -m sjtu_tpmshx.runs.tools.check_locked_environment "${{ matrix.lock }}"'
      - name: Check dependency compatibility
        shell: bash
        run: '"$CI_PYTHON" -m pip check'
      - name: Require real BO imports
        shell: bash
        run: |
          "$CI_PYTHON" - <<'PY'
          import torch
          import botorch
          import gpytorch
          print(f'torch={torch.__version__} botorch={botorch.__version__} gpytorch={gpytorch.__version__}')
          PY
      - name: Run optimizer and real acquisition tests
        shell: bash
        run: >-
          "$CI_PYTHON" -m pytest sjtu_tpmshx/tests/test_multi_condition_optimizer.py -q -ra
          --timeout=600 --timeout-method=thread
          --durations=10 --junitxml=.cache/ci/bo.xml
      - name: Save BO test outcomes and timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bo-test-reports-${{ matrix.os }}-py${{ matrix.python }}
          path: .cache/ci/bo.xml
          include-hidden-files: true
          retention-days: 7

  minimal-postprocess:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLCONFIGDIR: .cache/matplotlib
      XDG_CACHE_HOME: .cache/xdg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      TM1_REAL_HANDOFF_DIR: .cache/real-file-handoff
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: real-file-handoff
          path: .cache/real-file-handoff
      - name: Create isolated minimal environment
        run: |
          python -m venv "$RUNNER_TEMP/tm1-postprocess"
          echo "CI_PYTHON=$RUNNER_TEMP/tm1-postprocess/bin/python" >> "$GITHUB_ENV"
      - name: Install exact minimal dependencies
        run: '"$CI_PYTHON" -m pip install -r requirements/postprocess.txt'
      - name: Check minimal environment
        run: |
          "$CI_PYTHON" -m sjtu_tpmshx.runs.tools.check_locked_environment requirements/postprocess.txt
          "$CI_PYTHON" -m pip check
          "$CI_PYTHON" -m sjtu_tpmshx.runs.tools.check_three_module_environment
      - name: Run file and offline metric checks from source
        run: '"$CI_PYTHON" -m pytest sjtu_tpmshx/tests/io_tm1 sjtu_tpmshx/tests/postprocess_tm1 -q'
      - name: Evaluate real 2D and 3D files in the minimal environment
        run: '"$CI_PYTHON" -m pytest sjtu_tpmshx/tests/integration_tm1/test_minimal_install.py -q'
