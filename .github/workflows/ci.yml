# Complete supported-platform subsets, split across independent runners.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.scope.outputs.tier }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check document links and project commands
        run: python engineering/scripts/check_docs.py
      - name: Select required checks
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tier=$(python engineering/scripts/ci_scope.py select --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA")
          echo "tier=$tier" >> "$GITHUB_OUTPUT"

  native:
    needs: scope
    if: needs.scope.outputs.tier != 'docs'
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    uses: ./.github/workflows/native.yml
    with:
      os: ${{ matrix.os }}
      tier: ${{ needs.scope.outputs.tier }}

  tests:
    # Keep the protected check names when the macOS runner image changes.
    name: tests (${{ matrix.check_os || matrix.os }}, ${{ matrix.python }})
    needs: [scope, bo-tests, native, minimal-postprocess]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            check_os: macos-14
            python: "3.13"
          - os: windows-2022
            python: "3.12"
          - os: windows-2022
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - name: Require the expected jobs for this tier
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python engineering/scripts/ci_scope.py gate --tier '${{ needs.scope.outputs.tier }}' --stage summary
      - uses: actions/download-artifact@v8
        if: needs.scope.outputs.tier != 'docs'
        with:
          pattern: test-reports-${{ matrix.os }}-py${{ matrix.python }}-fast-*
          path: .cache/ci-shards
      - uses: actions/download-artifact@v8
        if: needs.scope.outputs.tier == 'full'
        with:
          pattern: native-dependencies-${{ matrix.os }}-py${{ matrix.python }}-shard-*
          path: .cache/ci-shards
      - uses: actions/download-artifact@v8
        if: needs.scope.outputs.tier != 'docs'
        with:
          name: bo-test-reports-${{ matrix.os }}-py${{ matrix.python }}
          path: .cache/ci-shards/bo
      - uses: actions/download-artifact@v8
        if: needs.scope.outputs.tier != 'docs'
        with:
          name: test-reports-${{ matrix.os }}-py${{ matrix.python }}-integration
          path: .cache/ci-shards/integration
      - name: Require complete coverage and platform reports
        if: needs.scope.outputs.tier != 'docs'
        env:
          CI_TIER: ${{ needs.scope.outputs.tier }}
        run: |
          if [[ "$CI_TIER" == full ]]; then
            coverage=(--covered-by .cache/ci-shards/native-dependencies-${{ matrix.os }}-py${{ matrix.python }}-shard-*/native-manifest)
          else
            coverage=(--omit-modules sjtu_tpmshx/development/tests/native/_ci_suite.txt)
          fi
          python engineering/scripts/check_ci_shards.py \
            .cache/ci-shards/test-reports-${{ matrix.os }}-py${{ matrix.python }}-fast-0/fast-manifest \
            .cache/ci-shards/test-reports-${{ matrix.os }}-py${{ matrix.python }}-fast-1/fast-manifest \
            "${coverage[@]}" --bo-report .cache/ci-shards/bo --integration-report .cache/ci-shards/integration

  bo-tests:
    needs: [scope, native]
    if: needs.scope.outputs.tier != 'docs'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            python: "3.13"
            lock: engineering/requirements/bo-macos.txt
          - os: windows-2022
            python: "3.12"
            lock: engineering/requirements/bo-windows.txt
          - os: windows-2022
            python: "3.13"
            lock: engineering/requirements/bo-windows.txt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      MPLCONFIGDIR: .cache/matplotlib
      XDG_CACHE_HOME: .cache/xdg
      QT_QPA_PLATFORM: offscreen
      TPMSHX_DISABLE_3D_PANEL: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            engineering/requirements/base.txt
            ${{ matrix.lock }}
      - name: Create isolated BO environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sjtu-bo-ci-venv"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'sjtu-bo-ci-venv'
          interpreter = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'CI_PYTHON={interpreter.as_posix()}\n')
          PY
      - name: Install locked BO dependencies
        shell: bash
        run: '"$CI_PYTHON" -m pip install -r "${{ matrix.lock }}"'
      - name: Check exact BO dependency lock
        shell: bash
        run: '"$CI_PYTHON" -m sjtu_tpmshx.development.runs.tools.check_locked_environment "${{ matrix.lock }}"'
      - name: Check dependency compatibility
        shell: bash
        run: '"$CI_PYTHON" -m pip check'
      - uses: actions/download-artifact@v8
        with:
          name: native-build-${{ matrix.os }}
          path: .cache/ci-native-build
      - name: Restore verified geometry, preparation and result libraries for BO
        shell: bash
        run: |
          "$CI_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          import shutil
          import tarfile
          host = 'windows-x64' if os.name == 'nt' else 'macos-arm64'
          prefix, suffix = ('', '.dll') if os.name == 'nt' else ('lib', '.dylib')
          with tarfile.open('.cache/ci-native-build/native-binaries.tar') as archive:
              for component in ('geometry', 'preparation', 'result'):
                  name = prefix + 'tpmshx_' + component + '_shared' + suffix
                  folder = component if component in ('preparation', 'result') else 'pilot'
                  member = folder + '-' + host + '/' + name
                  archive.extract(archive.getmember(member), '.cache/native-deps/build', filter='data')
                  source = Path('.cache/native-deps/build') / member
                  target = Path('sjtu_tpmshx/solvers/native/lib') / host / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
                  with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
                      output.write(f'TPMSHX_{component.upper()}_LIBRARY={target.resolve().as_posix()}\n')
          PY
      - name: Require real BO imports
        shell: bash
        run: |
          "$CI_PYTHON" - <<'PY'
          import torch
          import botorch
          import gpytorch
          print(f'torch={torch.__version__} botorch={botorch.__version__} gpytorch={gpytorch.__version__}')
          PY
      - name: Run optimizer and real acquisition tests
        shell: bash
        run: >-
          "$CI_PYTHON" -m pytest sjtu_tpmshx/development/tests/test_multi_condition_optimizer.py
          sjtu_tpmshx/development/tests/test_mass_design.py -q -ra
          -p sjtu_tpmshx.development.tests.ci_shard --ci-manifest=.cache/ci/bo-manifest
          --timeout=600 --timeout-method=thread
          --durations=10 --junitxml=.cache/ci/bo.xml
      - name: Save BO test outcomes and timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bo-test-reports-${{ matrix.os }}-py${{ matrix.python }}
          path: .cache/ci/
          include-hidden-files: true
          retention-days: 7

  result-build:
    needs: scope
    if: needs.scope.outputs.tier != 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLCONFIGDIR: .cache/matplotlib
      XDG_CACHE_HOME: .cache/xdg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Create the locked result build environment
        run: |
          python -m venv "$RUNNER_TEMP/tm1-result"
          echo "$RUNNER_TEMP/tm1-result/bin/python" > .venv-path
          echo "CI_PYTHON=$RUNNER_TEMP/tm1-result/bin/python" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/tm1-result/bin/python" -m pip install -r engineering/requirements/postprocess.txt
      - name: Fetch only the locked CMake tool
        run: '"$CI_PYTHON" engineering/scripts/build_native_dependencies.py fetch-cmake --component result'
      - name: Build, verify and publish the standard-only result image
        run: '"$CI_PYTHON" engineering/scripts/build_native_dependencies.py publish --component result --python-lock engineering/requirements/postprocess.txt'
      - name: Check the installed independent result SDK
        run: '"$CI_PYTHON" engineering/scripts/build_native_dependencies.py check-stages --component result --python-lock engineering/requirements/postprocess.txt'
      - name: Check result numerical contracts before publication of the artifact
        run: >-
          "$CI_PYTHON" -m pytest -q --junitxml=.cache/native-deps/logs/result-contracts.xml
          sjtu_tpmshx/development/tests/native/test_result_metrics.py
          sjtu_tpmshx/development/tests/native/test_result_checks.py
          sjtu_tpmshx/development/tests/test_native_result_balance.py
          sjtu_tpmshx/development/tests/test_native_zone_statistics.py
          sjtu_tpmshx/development/tests/test_native_result_loader.py
      - name: Include result distribution notices
        run: |
          "$CI_PYTHON" - <<'PY'
          from pathlib import Path
          import shutil
          native = Path('sjtu_tpmshx/solvers/native')
          notices = native / 'lib/linux-x86_64/licenses/native'
          notices.mkdir(parents=True)
          shutil.copy2('LICENSE', notices.parent / 'LICENSE')
          shutil.copy2(native / 'THIRD_PARTY_NOTICES.md', notices)
          shutil.copy2(native / 'dependencies-lock.toml', notices)
          shutil.copytree(native / 'licenses', notices / 'licenses')
          for record in ('result/sources.md', 'preparation/sources.md', 'geometry/README.md', 'geometry/fields-sources.md'):
              target = notices / record
              target.parent.mkdir(exist_ok=True)
              shutil.copy2(native / record, target)
          PY
      - name: Save the independent Linux result image
        uses: actions/upload-artifact@v7
        with:
          name: result-build-linux-x86_64
          path: sjtu_tpmshx/solvers/native/lib/linux-x86_64/
          if-no-files-found: error
          retention-days: 7
      - name: Save result build and caller evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-build-linux-logs
          path: .cache/native-deps/logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  minimal-postprocess:
    needs: [scope, native, result-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLCONFIGDIR: .cache/matplotlib
      XDG_CACHE_HOME: .cache/xdg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      TM1_REAL_HANDOFF_DIR: .cache/real-file-handoff
      TM1_WHEEL_DIR: .cache/python-distributions
      TPMSHX_RESULT_LIBRARY: ${{ github.workspace }}/sjtu_tpmshx/solvers/native/lib/linux-x86_64/libtpmshx_result_shared.so
    steps:
      - uses: actions/checkout@v7
      - name: Require the expected native result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python engineering/scripts/ci_scope.py gate --tier '${{ needs.scope.outputs.tier }}' --stage minimal
      - uses: actions/setup-python@v7
        if: needs.scope.outputs.tier != 'docs'
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        if: needs.scope.outputs.tier != 'docs'
        with:
          name: result-build-linux-x86_64
          path: sjtu_tpmshx/solvers/native/lib/linux-x86_64
      - uses: actions/download-artifact@v8
        if: needs.scope.outputs.tier != 'docs'
        with:
          name: real-file-handoff
          path: .cache/real-file-handoff
      - uses: actions/download-artifact@v8
        if: needs.scope.outputs.tier != 'docs'
        with:
          name: python-distributions-macos-15
          path: .cache/python-distributions
      - name: Create isolated minimal environment
        if: needs.scope.outputs.tier != 'docs'
        run: |
          python -m venv "$RUNNER_TEMP/tm1-postprocess"
          echo "CI_PYTHON=$RUNNER_TEMP/tm1-postprocess/bin/python" >> "$GITHUB_ENV"
      - name: Install exact minimal dependencies
        if: needs.scope.outputs.tier != 'docs'
        run: '"$CI_PYTHON" -m pip install -r engineering/requirements/postprocess.txt'
      - name: Check minimal environment
        if: needs.scope.outputs.tier != 'docs'
        run: |
          "$CI_PYTHON" -m sjtu_tpmshx.development.runs.tools.check_locked_environment engineering/requirements/postprocess.txt
          "$CI_PYTHON" -m pip check
          "$CI_PYTHON" -m sjtu_tpmshx.development.runs.tools.check_three_module_environment
      - name: Run file and offline metric checks from source
        if: needs.scope.outputs.tier != 'docs'
        run: '"$CI_PYTHON" -m pytest sjtu_tpmshx/development/tests/io_tm1 sjtu_tpmshx/development/tests/postprocess_tm1 -q'
      - name: Compare result kernels in the minimal Linux environment
        if: needs.scope.outputs.tier != 'docs'
        run: >-
          "$CI_PYTHON" -m pytest -q
          sjtu_tpmshx/development/tests/native/test_result_metrics.py
          sjtu_tpmshx/development/tests/native/test_result_checks.py
          sjtu_tpmshx/development/tests/test_native_result_balance.py
          sjtu_tpmshx/development/tests/test_native_zone_statistics.py
          sjtu_tpmshx/development/tests/test_native_result_loader.py
      - name: Evaluate real files from source and installed wheels in the minimal environment
        if: needs.scope.outputs.tier != 'docs'
        run: '"$CI_PYTHON" -m pytest sjtu_tpmshx/development/tests/integration_tm1/test_minimal_install.py -q'
