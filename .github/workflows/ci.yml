# Complete supported-platform subsets, split across independent runners.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-parts:
    name: test-part (${{ matrix.platform.os }}, ${{ matrix.platform.python }}, ${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        part: [fast-0, fast-1, integration]
        platform:
          - os: macos-14
            python: "3.13"
          - os: windows-2022
            python: "3.12"
          - os: windows-2022
            python: "3.13"
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      MPLCONFIGDIR: .cache/matplotlib
      XDG_CACHE_HOME: .cache/xdg
      QT_QPA_PLATFORM: offscreen
      TPMSHX_DISABLE_3D_PANEL: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "2"
      TPMSHX_REQUIRE_CPP_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Activate MSVC for native tests
        if: runner.os == 'Windows' && startsWith(matrix.part, 'fast-')
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'The required MSVC compiler is missing' }
          & "$installation\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          'CXX=cl' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.platform.python }}
          cache: pip
      - name: Create isolated CI environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sjtu-ci-venv"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'sjtu-ci-venv'
          interpreter = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          Path('.venv-path').write_text(interpreter.as_posix() + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'CI_PYTHON={interpreter.as_posix()}\n')
          PY
      - name: Install project
        shell: bash
        run: '"$CI_PYTHON" -m pip install -r requirements.txt'
      - name: Check exact dependency lock
        shell: bash
        run: '"$CI_PYTHON" -m sjtu_tpmshx.runs.tools.check_locked_environment requirements-lock.txt --allow-extra sjtu-tpmshx'
      - name: Check dependency compatibility
        shell: bash
        run: '"$CI_PYTHON" -m pip check'
      - name: Fetch locked Eigen headers for native temperature tests
        if: startsWith(matrix.part, 'fast-')
        shell: bash
        run: '"$CI_PYTHON" scripts/build_native_dependencies.py fetch-eigen'
      - name: Build and run independent C and C++ callers on macOS
        if: runner.os == 'macOS' && matrix.part == 'fast-0'
        run: make -f native/Makefile check
      - name: Build and run independent C and C++ callers on Windows
        if: runner.os == 'Windows' && matrix.part == 'fast-0'
        shell: cmd
        run: nmake /f native\Makefile.msvc check
      - name: Run fast test subset
        if: startsWith(matrix.part, 'fast-')
        shell: bash
        run: >-
          "$CI_PYTHON" -m pytest sjtu_tpmshx/tests/ -q -ra
          -m "not slow and not heavy" --ignore=sjtu_tpmshx/tests/integration_tm1
          -n 2 --dist loadscope --max-worker-restart=0
          -p sjtu_tpmshx.tests.ci_shard --ci-manifest=.cache/ci/fast-manifest
          --ci-shard=${{ matrix.part == 'fast-0' && '0' || '1' }}
          --timeout=600 --timeout-method=thread
          --durations=30 --junitxml=.cache/ci/fast.xml
      - name: Run real public module integration
        if: matrix.part == 'integration'
        shell: bash
        env:
          NUMBA_NUM_THREADS: "1"
        run: >-
          "$CI_PYTHON" -m pytest sjtu_tpmshx/tests/integration_tm1 -q -ra
          -p sjtu_tpmshx.tests.ci_shard --ci-manifest=.cache/ci/integration-manifest
          --timeout=600 --timeout-method=thread
          --durations=30 --junitxml=.cache/ci/integration.xml
      - name: Save test outcomes and timings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ matrix.platform.os }}-py${{ matrix.platform.python }}-${{ matrix.part }}
          path: .cache/ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  native-dependencies:
    name: native-dependencies (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: "3.13"
          - os: windows-2022
            python: "3.12"
          - os: windows-2022
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      MPLCONFIGDIR: .cache/matplotlib
      XDG_CACHE_HOME: .cache/xdg
      NUMBA_CACHE_DIR: .cache/numba
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "2"
      TPMSHX_REQUIRE_NATIVE_DEPS_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Activate MSVC for native qualification
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'The required MSVC compiler is missing' }
          & "$installation\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          'CXX=cl' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Create isolated native qualification environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sjtu-native-ci-venv"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'sjtu-native-ci-venv'
          interpreter = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          Path('.venv-path').write_text(interpreter.as_posix() + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'CI_PYTHON={interpreter.as_posix()}\n')
          PY
      - name: Install locked qualification dependencies
        shell: bash
        run: '"$CI_PYTHON" -m pip install -r requirements-lock.txt'
      - name: Check exact dependency lock
        shell: bash
        run: '"$CI_PYTHON" -m sjtu_tpmshx.runs.tools.check_locked_environment requirements-lock.txt'
      - name: Check dependency compatibility
        shell: bash
        run: '"$CI_PYTHON" -m pip check'
      - name: Fetch fixed native sources and build tool
        shell: bash
        run: '"$CI_PYTHON" scripts/build_native_dependencies.py fetch'
      - name: Build isolated native dependency pilots offline
        shell: bash
        run: '"$CI_PYTHON" scripts/build_native_dependencies.py build'
      - name: Run independent native callers
        shell: bash
        run: '"$CI_PYTHON" scripts/build_native_dependencies.py verify'
      - name: Require explicit native libraries for thermal evidence tests
        shell: bash
        run: |
          "$CI_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          host = 'windows-x64' if os.name == 'nt' else 'macos-arm64'
          prefix, suffix = ('', '.dll') if os.name == 'nt' else ('lib', '.dylib')
          build = Path('.cache/native-deps/build') / ('pilot-' + host)
          libraries = {
              'TPMSHX_NATIVE_SOLVER_LIBRARY': build / (prefix + 'tpmshx_solver_shared' + suffix),
              'TPMSHX_MODEL_H_PUBLIC_LIBRARY': build / (prefix + 'tpmshx_model_h_shared' + suffix),
          }
          for name, path in libraries.items():
              if not path.is_file():
                  raise FileNotFoundError(f'{name}: native library not built: {path}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for name, path in libraries.items():
                  output.write(f'{name}={path.resolve().as_posix()}\n')
          PY
      - name: Require native property, flow and thermal qualification
        shell: bash
        run: >-
          "$CI_PYTHON" -m pytest -q -ra
          sjtu_tpmshx/tests/native/test_native_eos.py
          sjtu_tpmshx/tests/native/test_native_pressure.py
          sjtu_tpmshx/tests/native/test_fluid_properties.py
          sjtu_tpmshx/tests/native/test_quick_design_driver.py
          sjtu_tpmshx/tests/native/test_cpp_quick_design.py
          sjtu_tpmshx/tests/native/test_superlu_error_boundary.py
          sjtu_tpmshx/tests/native/test_enthalpy_driver.py
          sjtu_tpmshx/tests/native/test_cpp_enthalpy.py
          sjtu_tpmshx/tests/native/test_model_h_2d.py
          sjtu_tpmshx/tests/native/test_model_h_3d.py
          sjtu_tpmshx/tests/native/test_cpp_model_h.py
          sjtu_tpmshx/tests/native/test_temperature_driver.py
          sjtu_tpmshx/tests/native/test_temperature_staggered.py
          sjtu_tpmshx/tests/native/test_cpp_temperature.py
          sjtu_tpmshx/tests/native/test_native_thermal_identity.py
          sjtu_tpmshx/tests/native/test_temperature_evidence.py
          sjtu_tpmshx/tests/native/test_full_2d_stage_identity.py
          sjtu_tpmshx/tests/native/test_pressure_reference.py
          sjtu_tpmshx/tests/native/test_native_outer_anderson.py
          sjtu_tpmshx/tests/native/test_simple_pressure.py
          sjtu_tpmshx/tests/native/test_simple_2d.py
          sjtu_tpmshx/tests/native/test_simple_2d_c_api.py
          sjtu_tpmshx/tests/native/test_simple_3d.py
          sjtu_tpmshx/tests/native/test_simple_3d_api.py
          sjtu_tpmshx/tests/native/test_refinement_2d.py
          sjtu_tpmshx/tests/native/test_full_2d.py
          sjtu_tpmshx/tests/native/test_full_2d_refinement.py
          sjtu_tpmshx/tests/native/test_cpp_full_2d.py
          sjtu_tpmshx/tests/native/test_cpp_full_2d_capture.py
          sjtu_tpmshx/tests/native/test_full_3d.py
          sjtu_tpmshx/tests/native/test_full_3d_refined_stages.py
          sjtu_tpmshx/tests/native/test_cpp_full_3d.py
          sjtu_tpmshx/tests/native/test_backend_engineering_parity.py
          sjtu_tpmshx/tests/native/test_cpp_conservative_full2d.py
          sjtu_tpmshx/tests/native/test_cpp_conservative_full3d.py
          --timeout=600 --timeout-method=thread --durations=20
          --junitxml=.cache/ci/native-dependencies.xml
      - name: Save native qualification outcomes
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-dependencies-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            .cache/ci/native-dependencies.xml
            .cache/native-deps/logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  tests:
    # Keep the existing required check names; BO is now enforced by these gates.
    name: tests (${{ matrix.os }}, ${{ matrix.python }})
    needs: [test-parts, bo-tests, native-dependencies]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: "3.13"
          - os: windows-2022
            python: "3.12"
          - os: windows-2022
            python: "3.13"
    steps:
      - name: Require every test part, BO job and native dependency job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          failed = {name: job['result'] for name, job in json.loads(os.environ['NEEDS_JSON']).items()
                    if job['result'] != 'success'}
          if failed:
              raise SystemExit(f'Required test jobs did not succeed: {failed}')
          PY
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: test-reports-${{ matrix.os }}-py${{ matrix.python }}-fast-*
          path: .cache/ci-shards
      - name: Require both complete and disjoint fast shards
        run: >-
          python scripts/check_ci_shards.py
          .cache/ci-shards/test-reports-${{ matrix.os }}-py${{ matrix.python }}-fast-0/fast-manifest
          .cache/ci-shards/test-reports-${{ matrix.os }}-py${{ matrix.python }}-fast-1/fast-manifest

  bo-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: "3.13"
            lock: requirements-lock-bo-macos.txt
          - os: windows-2022
            python: "3.12"
            lock: requirements-lock-server.txt
          - os: windows-2022
            python: "3.13"
            lock: requirements-lock-server.txt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      MPLCONFIGDIR: .cache/matplotlib
      XDG_CACHE_HOME: .cache/xdg
      QT_QPA_PLATFORM: offscreen
      TPMSHX_DISABLE_3D_PANEL: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            ${{ matrix.lock }}
      - name: Create isolated BO environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sjtu-bo-ci-venv"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'sjtu-bo-ci-venv'
          interpreter = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'CI_PYTHON={interpreter.as_posix()}\n')
          PY
      - name: Install locked BO dependencies
        shell: bash
        run: '"$CI_PYTHON" -m pip install -r "${{ matrix.lock }}"'
      - name: Check exact BO dependency lock
        shell: bash
        run: '"$CI_PYTHON" -m sjtu_tpmshx.runs.tools.check_locked_environment "${{ matrix.lock }}"'
      - name: Check dependency compatibility
        shell: bash
        run: '"$CI_PYTHON" -m pip check'
      - name: Require real BO imports
        shell: bash
        run: |
          "$CI_PYTHON" - <<'PY'
          import torch
          import botorch
          import gpytorch
          print(f'torch={torch.__version__} botorch={botorch.__version__} gpytorch={gpytorch.__version__}')
          PY
      - name: Run optimizer and real acquisition tests
        shell: bash
        run: >-
          "$CI_PYTHON" -m pytest sjtu_tpmshx/tests/test_multi_condition_optimizer.py -q -ra
          --timeout=600 --timeout-method=thread
          --durations=10 --junitxml=.cache/ci/bo.xml
      - name: Save BO test outcomes and timings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bo-test-reports-${{ matrix.os }}-py${{ matrix.python }}
          path: .cache/ci/bo.xml
          include-hidden-files: true
          retention-days: 7
