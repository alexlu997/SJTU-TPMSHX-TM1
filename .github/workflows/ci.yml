# Complete supported-platform subsets, split across independent runners.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-parts:
    name: test-part (${{ matrix.platform.os }}, ${{ matrix.platform.python }}, ${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        part: [fast-0, fast-1, integration]
        platform:
          - os: macos-14
            python: "3.13"
          - os: windows-2022
            python: "3.12"
          - os: windows-2022
            python: "3.13"
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      MPLCONFIGDIR: .cache/matplotlib
      XDG_CACHE_HOME: .cache/xdg
      QT_QPA_PLATFORM: offscreen
      TPMSHX_DISABLE_3D_PANEL: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.platform.python }}
          cache: pip
      - name: Create isolated CI environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sjtu-ci-venv"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'sjtu-ci-venv'
          interpreter = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'CI_PYTHON={interpreter.as_posix()}\n')
          PY
      - name: Install project
        shell: bash
        run: '"$CI_PYTHON" -m pip install -r requirements.txt'
      - name: Check exact dependency lock
        shell: bash
        run: '"$CI_PYTHON" -m sjtu_tpmshx.runs.tools.check_locked_environment requirements-lock.txt --allow-extra sjtu-tpmshx'
      - name: Check dependency compatibility
        shell: bash
        run: '"$CI_PYTHON" -m pip check'
      - name: Run fast test subset
        if: startsWith(matrix.part, 'fast-')
        shell: bash
        run: >-
          "$CI_PYTHON" -m pytest sjtu_tpmshx/tests/ -q -ra
          -m "not slow and not heavy" --ignore=sjtu_tpmshx/tests/integration_tm1
          -n 2 --dist loadscope --max-worker-restart=0
          -p sjtu_tpmshx.tests.ci_shard --ci-manifest=.cache/ci/fast-manifest
          --ci-shard=${{ matrix.part == 'fast-0' && '0' || '1' }}
          --timeout=600 --timeout-method=thread
          --durations=30 --junitxml=.cache/ci/fast.xml
      - name: Run real public module integration
        if: matrix.part == 'integration'
        shell: bash
        env:
          NUMBA_NUM_THREADS: "1"
        run: >-
          "$CI_PYTHON" -m pytest sjtu_tpmshx/tests/integration_tm1 -q -ra
          -p sjtu_tpmshx.tests.ci_shard --ci-manifest=.cache/ci/integration-manifest
          --timeout=600 --timeout-method=thread
          --durations=30 --junitxml=.cache/ci/integration.xml
      - name: Save test outcomes and timings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ matrix.platform.os }}-py${{ matrix.platform.python }}-${{ matrix.part }}
          path: .cache/ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  tests:
    # Keep the existing required check names; BO is now enforced by these gates.
    name: tests (${{ matrix.os }}, ${{ matrix.python }})
    needs: [test-parts, bo-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: "3.13"
          - os: windows-2022
            python: "3.12"
          - os: windows-2022
            python: "3.13"
    steps:
      - name: Require every test part and BO job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          failed = {name: job['result'] for name, job in json.loads(os.environ['NEEDS_JSON']).items()
                    if job['result'] != 'success'}
          if failed:
              raise SystemExit(f'Required test jobs did not succeed: {failed}')
          PY
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: test-reports-${{ matrix.os }}-py${{ matrix.python }}-fast-*
          path: .cache/ci-shards
      - name: Require both complete and disjoint fast shards
        run: >-
          python scripts/check_ci_shards.py
          .cache/ci-shards/test-reports-${{ matrix.os }}-py${{ matrix.python }}-fast-0/fast-manifest
          .cache/ci-shards/test-reports-${{ matrix.os }}-py${{ matrix.python }}-fast-1/fast-manifest

  bo-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: "3.13"
            lock: requirements-lock-bo-macos.txt
          - os: windows-2022
            python: "3.12"
            lock: requirements-lock-server.txt
          - os: windows-2022
            python: "3.13"
            lock: requirements-lock-server.txt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
      MPLCONFIGDIR: .cache/matplotlib
      XDG_CACHE_HOME: .cache/xdg
      QT_QPA_PLATFORM: offscreen
      TPMSHX_DISABLE_3D_PANEL: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            ${{ matrix.lock }}
      - name: Create isolated BO environment
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/sjtu-bo-ci-venv"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'sjtu-bo-ci-venv'
          interpreter = root / ('Scripts/python.exe' if os.name == 'nt' else 'bin/python')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'CI_PYTHON={interpreter.as_posix()}\n')
          PY
      - name: Install locked BO dependencies
        shell: bash
        run: '"$CI_PYTHON" -m pip install -r "${{ matrix.lock }}"'
      - name: Check exact BO dependency lock
        shell: bash
        run: '"$CI_PYTHON" -m sjtu_tpmshx.runs.tools.check_locked_environment "${{ matrix.lock }}"'
      - name: Check dependency compatibility
        shell: bash
        run: '"$CI_PYTHON" -m pip check'
      - name: Require real BO imports
        shell: bash
        run: |
          "$CI_PYTHON" - <<'PY'
          import torch
          import botorch
          import gpytorch
          print(f'torch={torch.__version__} botorch={botorch.__version__} gpytorch={gpytorch.__version__}')
          PY
      - name: Run optimizer and real acquisition tests
        shell: bash
        run: >-
          "$CI_PYTHON" -m pytest sjtu_tpmshx/tests/test_multi_condition_optimizer.py -q -ra
          --timeout=600 --timeout-method=thread
          --durations=10 --junitxml=.cache/ci/bo.xml
      - name: Save BO test outcomes and timings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bo-test-reports-${{ matrix.os }}-py${{ matrix.python }}
          path: .cache/ci/bo.xml
          include-hidden-files: true
          retention-days: 7
