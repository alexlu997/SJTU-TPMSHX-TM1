# Complete supported-platform subsets, split across independent runners.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tier: ${{ steps.scope.outputs.tier }}
      candidates: ${{ steps.native.outputs.candidates }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check document links and project commands
        run: python engineering/scripts/check_docs.py
      - name: Select required checks
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tier=$(python engineering/scripts/ci_scope.py select --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA")
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        if: steps.scope.outputs.tier != 'docs'
        with:
          python-version: '3.13'
      # Run lint and type checks once here, not in the pytest shards.
      # check_types needs setuptools to build the package tree and NumPy for array types.
      - name: Lint and type contracts
        if: steps.scope.outputs.tier != 'docs'
        run: |
          python -m pip install --disable-pip-version-check -c engineering/requirements/base.txt ruff mypy numpy setuptools PyYAML
          python -m ruff check .
          python -m engineering.scripts.check_types --platform darwin
          python -m engineering.scripts.check_types --platform win32
      - name: Find main builds with matching native inputs
        id: native
        if: steps.scope.outputs.tier != 'docs'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python engineering/scripts/ci_scope.py native-candidates --base "$BASE_SHA"

  native-toolchains:
    needs: scope
    if: needs.scope.outputs.candidates != ''
    strategy:
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      macos: ${{ steps.host.outputs.macos }}
      windows: ${{ steps.host.outputs.windows }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Identify the hosted image, Python, compilers, and SDK
        id: host
        run: python engineering/scripts/ci_scope.py native-toolchain --os ${{ matrix.os }}

  native-runtime:
    needs: [scope, native-toolchains]
    if: needs.scope.outputs.candidates != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.restore.outputs.reuse }}
    steps:
      - uses: actions/checkout@v7
      - name: Select and verify one archive pair for both hosted toolchains
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_CANDIDATES: ${{ needs.scope.outputs.candidates }}
          MACOS_HOST: ${{ needs.native-toolchains.outputs.macos }}
          WINDOWS_HOST: ${{ needs.native-toolchains.outputs.windows }}
        run: python engineering/scripts/ci_scope.py restore-pair
      - name: Save the verified macOS runtime
        if: steps.restore.outputs.reuse == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: trusted-native-macos-15
          path: .cache/ci-native-build/macos-15/native-binaries.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Save the verified Windows runtime
        if: steps.restore.outputs.reuse == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: trusted-native-windows-2022
          path: .cache/ci-native-build/windows-2022/native-binaries.tar
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  native-macos:
    needs: [scope, native-toolchains, native-runtime]
    if: &platform-required ${{ !cancelled() && needs.scope.result == 'success' && needs.scope.outputs.tier != 'docs' && !contains(needs.*.result, 'failure') }}
    name: native (macos-15)
    uses: ./.github/workflows/native.yml
    with:
      os: macos-15
      tier: ${{ needs.scope.outputs.tier }}
      reuse: &use-pair ${{ needs.native-runtime.outputs.reuse == 'true' }}

  native-windows:
    needs: [scope, native-toolchains, native-runtime]
    if: *platform-required
    name: native (windows-2022)
    uses: ./.github/workflows/native.yml
    with:
      os: windows-2022
      tier: ${{ needs.scope.outputs.tier }}
      reuse: *use-pair

  tests:
    # Keep the protected check names when the macOS runner image changes.
    name: tests (${{ matrix.check_os || matrix.os }}, ${{ matrix.python }})
    needs: [scope, native-macos, native-windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            check_os: macos-14
            python: "3.13"
          - os: windows-2022
            python: "3.12"
          - os: windows-2022
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - name: Require the expected jobs for this tier
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python engineering/scripts/ci_scope.py gate --tier '${{ needs.scope.outputs.tier }}' --stage summary
      - name: Require one artifact for each name in the run
        if: needs.scope.outputs.tier != 'docs'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # upload-artifact ignores a failed delete of an artifact from an earlier run attempt.
          # Remove repeated IDs first: an upload between two page requests can repeat an item.
          set -o pipefail
          duplicates=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | select(.name | contains("-logs-") | not) | "\(.id) \(.name)"' \
            | sort -u | cut -d ' ' -f 2- | sort | uniq -d)
          if [[ -n "$duplicates" ]]; then
            echo "::error::More than one run attempt uploaded these artifacts: ${duplicates//$'\n'/, }. download-artifact can select the earlier attempt. A rerun in this run does not remove the earlier artifacts. Start a new run: push a new commit, or start the ci workflow with workflow_dispatch."
            exit 1
          fi
      - uses: actions/download-artifact@v8
        if: needs.scope.outputs.tier != 'docs' && matrix.python == '3.13'
        with:
          pattern: test-reports-${{ matrix.os }}-py${{ matrix.python }}-fast-*
          path: .cache/ci-shards
      - uses: actions/download-artifact@v8
        if: needs.scope.outputs.tier == 'full' && matrix.python == '3.13'
        with:
          pattern: native-dependencies-${{ matrix.os }}-py${{ matrix.python }}-shard-*
          path: .cache/ci-shards
      - uses: actions/download-artifact@v8
        if: needs.scope.outputs.tier != 'docs'
        with:
          name: bo-test-reports-${{ matrix.os }}-py${{ matrix.python }}
          path: .cache/ci-shards/bo
      - uses: actions/download-artifact@v8
        if: needs.scope.outputs.tier != 'docs'
        with:
          name: test-reports-${{ matrix.os }}-py${{ matrix.python }}-integration
          path: .cache/ci-shards/integration
      - name: Require complete coverage and platform reports
        if: needs.scope.outputs.tier != 'docs'
        env:
          CI_TIER: ${{ needs.scope.outputs.tier }}
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          shards=()
          if [[ "$PYTHON_VERSION" == 3.13 ]]; then
            shards=(.cache/ci-shards/test-reports-${{ matrix.os }}-py3.13-fast-{0,1}/fast-manifest)
            if [[ "$CI_TIER" == full ]]; then
              shards+=(--covered-by .cache/ci-shards/native-dependencies-${{ matrix.os }}-py3.13-shard-*/native-manifest)
            else
              shards+=(--omit-modules tests/python/native/_ci_suite.txt)
            fi
          fi
          python engineering/scripts/check_ci_shards.py "${shards[@]}" \
            --bo-report .cache/ci-shards/bo --integration-report .cache/ci-shards/integration

  result-build:
    needs: scope
    if: needs.scope.outputs.tier != 'docs'
    # Keep the accepted image while checking the newer compiler.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      MPLCONFIGDIR: .cache/matplotlib
      XDG_CACHE_HOME: .cache/xdg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Create the locked result build environment
        run: |
          python -m venv "$RUNNER_TEMP/tm1-result"
          echo "$RUNNER_TEMP/tm1-result/bin/python" > .venv-path
          echo "CI_PYTHON=$RUNNER_TEMP/tm1-result/bin/python" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/tm1-result/bin/python" -m pip install -r engineering/requirements/postprocess.txt
      - name: Fetch only the locked CMake tool
        run: '"$CI_PYTHON" engineering/scripts/build_native_dependencies.py fetch-cmake --component result'
      - name: Build, verify and publish the standard-only result image
        run: '"$CI_PYTHON" engineering/scripts/build_native_dependencies.py publish --component result --python-lock engineering/requirements/postprocess.txt'
      - name: Check the installed independent result SDK
        run: '"$CI_PYTHON" engineering/scripts/build_native_dependencies.py check-stages --component result --python-lock engineering/requirements/postprocess.txt'
      - name: Check result numerical contracts before publication of the artifact
        run: >-
          "$CI_PYTHON" -m pytest -q --junitxml=.cache/native-deps/logs/result-contracts.xml
          tests/python/native/test_result_metrics.py
          tests/python/native/test_result_checks.py
          tests/python/native_adapters/test_native_result_balance.py
          tests/python/native_adapters/test_native_zone_statistics.py
          tests/python/native_adapters/test_native_result_loader.py
          tests/python/native_adapters/test_native_result_stage.py
          tests/python/native_adapters/test_native_result_stage_host.py
          tests/python/native_adapters/test_native_quick_result_stage.py
      - name: Include result distribution notices
        run: |
          "$CI_PYTHON" - <<'PY'
          from pathlib import Path
          import shutil
          from engineering.scripts.build_native_dependencies import stage_native_notices
          notices = Path('sjtu_tpmshx/solvers/native/lib/linux-x86_64/licenses')
          stage_native_notices(Path.cwd(), notices / 'native')
          shutil.copy2('LICENSE', notices / 'LICENSE')
          PY
      # A rerun tries to replace the artifact of the earlier attempt (see native.yml).
      - name: Save the independent Linux result image
        uses: actions/upload-artifact@v7
        with:
          name: result-build-linux-x86_64-${{ matrix.os }}
          path: sjtu_tpmshx/solvers/native/lib/linux-x86_64/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Save result build and caller evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-build-linux-logs-${{ matrix.os }}
          path: .cache/native-deps/logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  minimal-postprocess:
    needs: [scope, native-macos, result-build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      MPLCONFIGDIR: .cache/matplotlib
      XDG_CACHE_HOME: .cache/xdg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      TM1_REAL_HANDOFF_DIR: .cache/real-file-handoff
      TM1_WHEEL_DIR: .cache/python-distributions
      TPMSHX_RESULT_LIBRARY: ${{ github.workspace }}/sjtu_tpmshx/solvers/native/lib/linux-x86_64/libtpmshx_result_shared.so
    steps:
      - uses: actions/checkout@v7
      - name: Require the expected native result
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python engineering/scripts/ci_scope.py gate --tier '${{ needs.scope.outputs.tier }}' --stage minimal
      - uses: actions/setup-python@v7
        if: needs.scope.outputs.tier != 'docs'
        with:
          python-version: '3.13'
      - name: Require one artifact for each name in the run
        if: needs.scope.outputs.tier != 'docs'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # upload-artifact ignores a failed delete of an artifact from an earlier run attempt.
          # Remove repeated IDs first: an upload between two page requests can repeat an item.
          set -o pipefail
          duplicates=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired | not) | select(.name | contains("-logs-") | not) | "\(.id) \(.name)"' \
            | sort -u | cut -d ' ' -f 2- | sort | uniq -d)
          if [[ -n "$duplicates" ]]; then
            echo "::error::More than one run attempt uploaded these artifacts: ${duplicates//$'\n'/, }. download-artifact can select the earlier attempt. A rerun in this run does not remove the earlier artifacts. Start a new run: push a new commit, or start the ci workflow with workflow_dispatch."
            exit 1
          fi
      - uses: actions/download-artifact@v8
        if: needs.scope.outputs.tier != 'docs'
        with:
          name: result-build-linux-x86_64-ubuntu-24.04
          path: sjtu_tpmshx/solvers/native/lib/linux-x86_64
      - uses: actions/download-artifact@v8
        if: needs.scope.outputs.tier != 'docs'
        with:
          name: real-file-handoff
          path: .cache/real-file-handoff
      - uses: actions/download-artifact@v8
        if: needs.scope.outputs.tier != 'docs'
        with:
          name: python-distributions-macos-15
          path: .cache/python-distributions
      - name: Create isolated minimal environment
        if: needs.scope.outputs.tier != 'docs'
        run: |
          python -m venv "$RUNNER_TEMP/tm1-postprocess"
          echo "CI_PYTHON=$RUNNER_TEMP/tm1-postprocess/bin/python" >> "$GITHUB_ENV"
      - name: Install exact minimal dependencies
        if: needs.scope.outputs.tier != 'docs'
        run: '"$CI_PYTHON" -m pip install -r engineering/requirements/postprocess.txt'
      - name: Check minimal environment
        if: needs.scope.outputs.tier != 'docs'
        run: |
          "$CI_PYTHON" -m sjtu_tpmshx.development.runs.tools.check_locked_environment engineering/requirements/postprocess.txt
          "$CI_PYTHON" -m pip check
          "$CI_PYTHON" -m sjtu_tpmshx.development.runs.tools.check_three_module_environment
      - name: Run file and offline metric checks from source
        if: needs.scope.outputs.tier != 'docs'
        run: '"$CI_PYTHON" -m pytest tests/python/io_tm1 tests/python/postprocess_tm1 -q'
      - name: Evaluate real files from source and installed wheels in the minimal environment
        if: needs.scope.outputs.tier != 'docs'
        run: '"$CI_PYTHON" -m pytest tests/python/integration_tm1/test_minimal_install.py -q'
